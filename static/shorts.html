<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PIXELTube · Shorts</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <script src="settings.js" defer></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="styles.css?v=auth-iframe-2">
  
  <style>
    body { background: #000; color: #fff; margin: 0; overflow: hidden; }
    .shorts-feed {
      height: 100vh; width: 100vw;
      overflow-y: scroll; scroll-snap-type: y mandatory;
      scrollbar-width: none; /* Firefox */
    }
    .shorts-feed::-webkit-scrollbar { display: none; /* Chrome */ }
    
    .short-container {
      height: 100vh; width: 100%;
      scroll-snap-align: start;
      position: relative;
      display: flex; justify-content: center; align-items: center;
      background: #111;
    }
    
    .short-video {
      height: 100%; max-width: 100%; object-fit: contain;
    }
    
    /* Sidebar Overlay */
    .short-ui {
      position: absolute; right: 16px; bottom: 80px;
      display: flex; flex-direction: column; align-items: center; gap: 20px;
    }
    .short-btn {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      color: #fff; font-size: 12px; cursor: pointer;
    }
    .short-btn i { font-size: 28px; text-shadow: 0 2px 8px rgba(0,0,0,0.5); }
    .short-btn.active i { color: #ef4444; }
    
    /* Bottom Info */
    .short-info {
      position: absolute; left: 16px; bottom: 20px; width: calc(100% - 80px);
      z-index: 10;
    }
    .short-channel { font-weight: 700; font-size: 16px; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
    .short-title { font-size: 14px; line-height: 1.4; margin-bottom: 8px; }
    
    /* Gradient for readability */
    .short-container::after {
      content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 200px;
      background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
      pointer-events: none; z-index: 5;
    }

    /* Header */
    .shorts-header {
      position: fixed; top: 0; left: 0; right: 0; padding: 16px;
      display: flex; justify-content: space-between; align-items: center;
      z-index: 20; pointer-events: none;
    }
    .shorts-header a, .shorts-header span { pointer-events: auto; }
  </style>
</head>
<body>

  <header class="shorts-header">
    <a href="index.html" class="btn btn-outline" style="border:none; color:#fff; background:rgba(0,0,0,0.5);">
      <i class="fas fa-arrow-left"></i> Back
    </a>
    <span style="font-weight:700; font-size:18px;">Shorts</span>
    <div style="width: 70px;"></div> <!-- spacer -->
  </header>

  <main id="shortsFeed" class="shorts-feed">
    <!-- Videos will be injected here -->
  </main>

  <script src="theme-init.js" defer></script>
  <script src="js/pixlect-crypto.js" defer></script>
  <script src="js/login.js?v=auth-iframe-3" defer></script>
  <script src="storage.js"></script>
  <script>
    const feedEl = document.getElementById('shortsFeed');
    const playerVideos = [];

    function getUserId() {
      const user = window.PIXELTubeAuth?.user;
      if (!user) return '';
      return user.PIXELUserUUID || user.pixelUserUUID || user.user_uuid 
          || user.PIXELUser?.UUID || user.pixelUser?.uuid || user.uuid || user.uid || '';
    }

    async function loadShorts() {
      try {
        const userId = getUserId();
        const url = `/api/videos/shorts${userId ? '?user_id=' + userId : ''}`;
        const res = await fetch(url);
        const data = await res.json();
        
        if (!data.videos || !data.videos.length) {
          feedEl.innerHTML = '<div style="display:flex; height:100vh; align-items:center; justify-content:center; color:#aaa;">No Shorts available yet.</div>';
          return;
        }

        data.videos.forEach(video => {
          feedEl.appendChild(createShortElement(video));
        });

        setupAutoplay();
      } catch (err) {
        console.error("Failed to load Shorts:", err);
      }
    }

    function createShortElement(video) {
      const div = document.createElement('div');
      div.className = 'short-container';
      div.dataset.videoId = video.id;
      
      div.innerHTML = `
        <video class="short-video" src="${video.url}" loop playsinline preload="metadata"></video>
        
        <div class="short-ui">
          <div class="short-btn" onclick="reactToShort('${video.id}', 'like', this)">
            <i class="fas fa-heart"></i>
            <span>${video.likes || 0}</span>
          </div>
          <a href="video_player.html?id=${video.id}" class="short-btn">
            <i class="fas fa-comment"></i>
          </a>
          <div class="short-btn" onclick="shareShort('${video.id}')">
            <i class="fas fa-share"></i>
          </div>
        </div>
        
        <div class="short-info">
          <div class="short-channel">
            <div class="avatar" style="width:32px; height:32px;"></div>
            @${video.channel || video.creator_name || 'Channel'}
          </div>
          <div class="short-title">${video.title}</div>
          <div style="font-size:12px; color:#aaa;">
            <i class="fas fa-music"></i> Original Audio - ${video.category}
          </div>
        </div>
      `;
      return div;
    }

    // Automatically play the video when it scrolls into view
    function setupAutoplay() {
      const videos = document.querySelectorAll('.short-video');
      
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          const video = entry.target;
          if (entry.isIntersecting) {
            video.play().catch(() => {}); // catch autoplay block
          } else {
            video.pause();
          }
        });
      }, { threshold: 0.6 }); // Trigger when 60% of the video is visible

      videos.forEach(v => observer.observe(v));
    }

    async function reactToShort(videoId, reaction, btnEl) {
      try {
        const user = window.PIXELTubeAuth?.user;
        if (!user) return alert("Sign in to like Shorts!");
        
        btnEl.style.pointerEvents = 'none';
        await PIXELTubeAPI.setReaction(videoId, reaction, user);
        btnEl.classList.toggle('active');
        
        // Optimistic UI update for the count
        const countSpan = btnEl.querySelector('span');
        let count = parseInt(countSpan.textContent);
        countSpan.textContent = btnEl.classList.contains('active') ? count + 1 : Math.max(0, count - 1);
        
        btnEl.style.pointerEvents = 'auto';
      } catch (err) {
        alert(err.message);
        btnEl.style.pointerEvents = 'auto';
      }
    }

    async function shareShort(videoId) {
      const url = new URL(`video_player.html?id=${videoId}`, location.href).href;
      try {
        if (navigator.share) await navigator.share({ title: 'Watch this Short', url });
        else { await navigator.clipboard.writeText(url); alert('Link copied!'); }
      } catch (err) {}
    }

    document.addEventListener('DOMContentLoaded', () => {
      // Wait for Auth to be ready so the AI knows who is watching
      window.PIXELTubeAuth?.ready().then(() => {
        loadShorts();
      });
    });
  </script>
</body>
</html>
