<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PIXELTube · Upload</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="adsense.js" async></script>
  <style>body { font-family:'Inter',system-ui,sans-serif; background:#fff; }</style>
</head>
<body class="p-6 max-w-xl mx-auto">
  <header class="flex items-center justify-between mb-6">
    <a href="index.html" class="flex items-center gap-2 font-bold text-lg text-gray-900">
      <img src="favicon.ico" alt="" width="28" height="28">
      PIXELTube
    </a>
    <a href="settings.html?returnTo=upload.html" class="text-sm text-blue-900 underline">Settings</a>
  </header>
  <h1 class="text-2xl font-bold mb-4">Upload a video</h1>
  <form id="uploadForm" class="space-y-3">
    <input type="file" id="file" accept="video/*" required class="block w-full text-sm">
    <input type="text" id="title" placeholder="Title" required class="w-full px-4 py-2 border rounded-lg">
    <input type="text" id="category" placeholder="Category (e.g. Coding)" class="w-full px-4 py-2 border rounded-lg">
    <p id="channelPrompt" class="text-sm text-gray-600"></p>
    <button type="submit" class="px-5 py-2 bg-red-600 text-white rounded-full font-medium">Upload</button>
  </form>
  <p id="log" class="mt-4 text-sm text-gray-700" role="status" aria-live="polite"></p>
  <footer class="mt-8 flex flex-wrap gap-4 text-sm text-gray-600">
    <a href="privacy.html">Privacy Policy</a>
    <a href="community-guidelines.html">Community Guidelines</a>
    <a href="terms.html">Terms of Service</a>
  </footer>

  <script src="storage.js"></script>
  <script src="settings.js"></script>
  <script>
    const uploadProfile = PIXELTubeSettings.get();
    document.getElementById('channelPrompt').textContent = uploadProfile.channel
      ? `Publishing to ${uploadProfile.channel}`
      : 'Set up a channel in Settings before publishing.';
    if (!uploadProfile.channel) {
      const settingsLink = document.createElement('a');
      settingsLink.href = 'settings.html?returnTo=upload.html';
      settingsLink.className = 'underline';
      settingsLink.textContent = ' Open Settings';
      document.getElementById('channelPrompt').appendChild(settingsLink);
    }
    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const log = document.getElementById('log');
      const file = document.getElementById('file').files[0];
      const title = document.getElementById('title').value;
      const category = document.getElementById('category').value || 'General';
      const profile = PIXELTubeSettings.get();

      if (!profile.channel) {
        log.textContent = 'Set a channel name in Settings before publishing.';
        return;
      }
      log.textContent = 'Uploading...';
      try {
        const result = await PIXELTubeAPI.uploadVideo(file, {
          title, category, channel: profile.channel, creator_name: profile.name,
        });
        if (!result.id) throw new Error('Upload completed, but no video ID was returned.');
        log.textContent = 'Your video is live! Opening it now…';
        setTimeout(() => {
          window.location.href = `video_player.html?id=${encodeURIComponent(result.id)}`;
        }, 1200);
      } catch (err) {
        log.textContent = `Upload failed: ${err.message}`;
      }
    });
  </script>
</body>
</html>
