<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIXEL Creative</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 20'><rect width='28' height='20' rx='5' fill='%23ff0000'/><path d='M11.2 5.6v8.8L19 10z' fill='%23fff'/></svg>">
<style>
  :root { --bg: #0f0f0f; --bg-elev: #212121; --text: #f1f1f1; --text-dim: #aaaaaa; --border: #303030; --hover: #272727; --accent: #ff0000; --studio-bg: #1f1f1f; --studio-card: #282828; --blue: #3ea6ff; }
  * { box-sizing: border-box; }
  body { font-family: Roboto, system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; height: 100vh; overflow: hidden; }
  .sidebar { width: 240px; background: var(--bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 12px 0; }
  .logo-area { padding: 0 16px 16px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--border); margin-bottom: 12px; }
  .nav-item { padding: 10px 24px; display: flex; align-items: center; gap: 16px; cursor: pointer; color: var(--text-dim); font-size: 14px; font-weight: 500; }
  .nav-item:hover { background: var(--hover); color: var(--text); }
  .nav-item.active { background: var(--hover); color: var(--text); border-left: 3px solid var(--blue); }
  .back-link { margin-top: auto; padding: 16px 24px; color: var(--blue); text-decoration: none; font-size: 14px; display: flex; align-items: center; gap: 8px; }
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--studio-bg); }
  .topbar { height: 56px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; background: var(--bg); flex-shrink: 0; }
  .content { flex: 1; overflow-y: auto; padding: 24px; max-width: 1200px; margin: 0 auto; width: 100%; }
  .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
  .header-row h1 { margin: 0; font-size: 24px; font-weight: 500; }
  .btn-upload { background: var(--blue); color: #0f0f0f; border: none; padding: 10px 20px; border-radius: 20px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; }
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 32px; }
  .stat-card { background: var(--studio-card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
  .stat-title { color: var(--text-dim); font-size: 13px; font-weight: 500; margin-bottom: 8px; text-transform: uppercase; }
  .stat-value { font-size: 32px; font-weight: 700; }
  .panel { background: var(--studio-card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .panel-head { padding: 16px 20px; border-bottom: 1px solid var(--border); }
  .table { width: 100%; border-collapse: collapse; text-align: left; }
  .table th { padding: 16px; border-bottom: 1px solid var(--border); color: var(--text-dim); font-size: 12px; text-transform: uppercase; }
  .table td { padding: 16px; border-bottom: 1px solid var(--border); font-size: 14px; }
  .video-cell { display: flex; gap: 16px; align-items: center; }
  .video-thumb { width: 120px; aspect-ratio: 16/9; border-radius: 8px; object-fit: cover; background: #000; }
  .video-info h4 { margin: 0 0 4px; font-size: 14px; font-weight: 500; }
  .video-info span { font-size: 12px; color: var(--text-dim); }
  .btn-icon { background: transparent; border: none; color: var(--text-dim); cursor: pointer; padding: 8px; border-radius: 50%; }
  .btn-danger { color: #ff4444; }
  .empty-state { text-align: center; padding: 80px 20px; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 999; }
  .modal-overlay.active { display: flex; }
  .modal { background: var(--bg-elev); padding: 24px; border-radius: 12px; width: 500px; max-width: 90vw; border: 1px solid var(--border); }
  .modal input, .modal select { width: 100%; padding: 12px; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 8px; margin-bottom: 16px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px; }
  .btn-cancel { background: transparent; color: var(--text); border: none; font-weight: 600; cursor: pointer; }
  .btn-confirm { background: var(--blue); color: #000; border: none; padding: 10px 20px; border-radius: 20px; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>

<div class="sidebar">
  <div class="logo-area">
    <svg viewBox="0 0 28 20" width="28"><rect width="28" height="20" rx="5" fill="#ff0000"/><path d="M11.2 5.6v8.8L19 10z" fill="#fff"/></svg>
    <span style="font-weight: 700; font-size: 18px;">PIXEL Creative</span>
  </div>
  <div class="nav-item active" data-view="dashboard">Dashboard</div>
  <div class="nav-item" data-view="content">Content</div>
  <a href="index.html" class="back-link">← Back to PIXELTube</a>
</div>

<div class="main">
  <div class="topbar">
    <div style="font-weight: 600;">Channel Dashboard</div>
    <div style="display:flex; align-items:center; gap: 8px;" id="channel-profile"></div>
  </div>
  <div class="content" id="studio-content"></div>
</div>

<div class="modal-overlay" id="uploadModal">
  <div class="modal">
    <h2>Upload to PIXELTube</h2>
    <label>Title</label>
    <input type="text" id="upTitle" placeholder="Title">
    <label>Thumbnail URL</label>
    <input type="text" id="upThumb" placeholder="https://...">
    <label>Video Type</label>
    <select id="upType">
      <option value="videos">Standard Video</option>
      <option value="minis">Mini (Shorts)</option>
    </select>
    <label>Select File(s)</label>
    <input type="file" id="upFile" accept="video/mp4,video/webm" multiple>
    <div class="modal-actions">
      <button class="btn-cancel" id="cancelUpload">Cancel</button>
      <button class="btn-confirm" id="confirmUpload">Upload</button>
    </div>
  </div>
</div>

<script src="/pixlect-crypto.js"></script>
<script src="/login.js" defer></script>

<script type="module">
import { initLoginManager } from './loginmanager.js';
import { uploadInChunks } from './storage.js';
import { getDatabase, saveDatabase, addVideoToDatabase } from './statistics.js';

let currentChannel = null;
const contentEl = document.getElementById('studio-content');
const profileEl = document.getElementById('channel-profile');

initLoginManager((channel) => {
    if (channel) {
        currentChannel = channel;
        profileEl.innerHTML = `<div style="width:32px; height:32px; border-radius:50%; background:${channel.avatarColor}; display:grid; place-items:center; font-weight:700; color:#fff;">${channel.name[0].toUpperCase()}</div><span style="font-weight:500;">${channel.name}</span>`;
        renderView('dashboard');
    } else {
        contentEl.innerHTML = `<div class="empty-state"><h2>Sign in to PIXEL Creative</h2><button id="studioLoginBtn" class="btn-upload">Sign in</button></div>`;
        document.getElementById('studioLoginBtn').onclick = () => window.PIXELTubeAuth.login();
    }
});

document.querySelectorAll('.nav-item').forEach(item => {
    item.addEventListener('click', (e) => {
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        e.currentTarget.classList.add('active');
        renderView(e.currentTarget.dataset.view);
    });
});

async function renderView(view) {
    if (!currentChannel) return;
    contentEl.innerHTML = `<div style="padding:80px;text-align:center;color:var(--text-dim);">Loading...</div>`;
    let db = { videos: {}, likes: {} };
    try { db = await getDatabase(); } catch(e) {}
    const allVideos = db.videos ? Object.values(db.videos) : [];
    const myVideos = allVideos.filter(v => v.channelUid === currentChannel.uid);

    if (view === 'dashboard') {
        contentEl.innerHTML = `
            <div class="header-row"><h1>Channel Dashboard</h1><button class="btn-upload" id="openUpload">Upload Video</button></div>
            <div class="stat-grid">
                <div class="stat-card"><div class="stat-title">Subscribers</div><div class="stat-value">${currentChannel.subscribers}</div></div>
                <div class="stat-card"><div class="stat-title">Total Views</div><div class="stat-value">${currentChannel.totalViews}</div></div>
                <div class="stat-card"><div class="stat-title">Videos</div><div class="stat-value">${myVideos.length}</div></div>
            </div>
            <div class="panel">
                <div class="panel-head"><h2>Latest Videos</h2></div>
                ${myVideos.length ? `
                <table class="table">
                    <thead><tr><th>Video</th><th>Views</th><th>Likes</th></tr></thead>
                    <tbody>${myVideos.slice(0,3).map(v => `<tr><td><div class="video-cell"><img src="${v.thumbnail}" class="video-thumb"><div class="video-info"><h4>${v.title}</h4><span>${v.time}</span></div></div></td><td>0</td><td>${db.likes[v.id] || 0}</td></tr>`).join('')}</tbody>
                </table>` : `<div class="empty-state"><p>No videos yet.</p></div>`}
            </div>
        `;
        document.getElementById('openUpload').onclick = () => document.getElementById('uploadModal').classList.add('active');
    } 
    else if (view === 'content') {
        contentEl.innerHTML = `
            <div class="header-row"><h1>Channel Content</h1><button class="btn-upload" id="openUpload">Upload Video</button></div>
            <div class="panel">
                ${myVideos.length ? `
                <table class="table">
                    <thead><tr><th>Video</th><th>Date</th><th>Actions</th></tr></thead>
                    <tbody>${myVideos.map(v => `<tr><td><div class="video-cell"><img src="${v.thumbnail}" class="video-thumb"><div class="video-info"><h4>${v.title}</h4><span>${v.duration}</span></div></div></td><td>${v.time}</td><td><button class="btn-icon btn-danger" data-del="${v.id}">Delete</button></td></tr>`).join('')}</tbody>
                </table>` : `<div class="empty-state"><p>No videos.</p></div>`}
            </div>
        `;
        document.getElementById('openUpload').onclick = () => document.getElementById('uploadModal').classList.add('active');
        document.querySelectorAll('[data-del]').forEach(btn => {
            btn.onclick = async () => {
                if (confirm('Delete this video?')) {
                    const db = await getDatabase(); delete db.videos[btn.dataset.del]; await saveDatabase(db); renderView('content');
                }
            };
        });
    }
}

const modal = document.getElementById('uploadModal');
document.getElementById('cancelUpload').onclick = () => modal.classList.remove('active');

document.getElementById('confirmUpload').onclick = async () => {
    const title = document.getElementById('upTitle').value.trim();
    const thumb = document.getElementById('upThumb').value.trim();
    const type = document.getElementById('upType').value;
    const files = document.getElementById('upFile').files;
    const btn = document.getElementById('confirmUpload');

    if (!title || !thumb || files.length === 0) return alert("Please fill fields and select at least one file.");
    btn.disabled = true; 

    try {
        for (let i = 0; i < files.length; i++) {
            const file = files[i];
            const fileTitle = files.length > 1 ? `${title} - Part ${i + 1}` : title;
            await uploadInChunks(file, file.name, type, (progress) => { btn.textContent = `File ${i+1}/${files.length} - ${Math.round(progress * 100)}%`; });
            const newVid = { id: `bunny-${type}-${file.name}`, title: fileTitle, thumbnail: thumb, channelUid: currentChannel.uid, channelName: currentChannel.name, channelAvatar: currentChannel.avatarColor, views: '0', time: 'Just now', duration: '0:00', videoUrl: `https://${window.BUNNY_CDN || 'apullzone.b-cdn.net'}/${type}/${file.name}`, isMini: type === 'minis' };
            await addVideoToDatabase(newVid);
        }
        modal.classList.remove('active');
        document.getElementById('upTitle').value = ''; document.getElementById('upThumb').value = ''; document.getElementById('upFile').value = '';
        renderView('dashboard');
        alert(`Successfully uploaded ${files.length} video(s)!`);
    } catch (err) { alert("Upload failed. Check console."); } finally { btn.disabled = false; btn.textContent = "Upload"; }
};
</script>
</body>
</html>
