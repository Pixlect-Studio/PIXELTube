<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PIXELTube</title>
<link rel="icon" type="image/png" href="./logo.png" />
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0e1a; --surface:#0f1424; --surface2:#161d33; --line:#1f2a44;
  --text:#f0f4ff; --muted:#8b98b8; --accent:#38bdf8; --accent2:#1d4ed8;
  --ok:#22d3ee; --warn:#fbbf24; --r:14px;
}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text);
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit}
img{display:block}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#2a3654;border-radius:20px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- LOADING SCREEN ---------- */
#loader{
  position:fixed;inset:0;z-index:5000;
  background:radial-gradient(circle at 50% 40%, #0f1a35 0%, #050810 70%);
  display:grid;place-items:center;
  transition:opacity .4s ease, visibility .4s ease;
}
#loader.hide{opacity:0;visibility:hidden;pointer-events:none}
#loader .inner{display:flex;flex-direction:column;align-items:center;gap:26px}
#loader img{
  width:110px;height:110px;object-fit:contain;
  filter:drop-shadow(0 0 40px rgba(56,189,248,.55));
  animation:pulse 2.4s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{transform:scale(1);opacity:1}
  50%{transform:scale(1.04);opacity:.92}
}
#loader .name{
  font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  font-size:24px;font-weight:700;letter-spacing:-.6px;
}
#loader .name b{
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
#loader .bar{
  width:180px;height:4px;border-radius:99px;background:rgba(56,189,248,.12);
  overflow:hidden;position:relative;
}
#loader .bar::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);
  animation:slide 1.4s linear infinite;
}
@keyframes slide{
  0%{transform:translateX(-100%)}
  100%{transform:translateX(100%)}
}
#loader .status{
  font-size:12px;color:var(--muted);letter-spacing:.3px;
}

/* TOPBAR */
.topbar{
  height:56px;flex:none;display:flex;align-items:center;gap:10px;
  padding:0 14px;border-bottom:1px solid var(--line);
  background:rgba(10,14,26,.96);backdrop-filter:blur(10px);z-index:50;
}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;transition:background .15s;flex:none}
.icon-btn:hover{background:var(--surface2)}
.icon-btn svg{width:21px;height:21px;fill:currentColor}
.logo{display:flex;align-items:center;gap:8px;flex:none;margin-right:6px}
.logo-mark{
  width:36px;height:36px;border-radius:9px;display:grid;place-items:center;
  overflow:hidden;
}
.logo-mark img{width:100%;height:100%;object-fit:contain}
.logo-text{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:19px;font-weight:700;letter-spacing:-.6px}
.logo-text b{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.search{
  flex:1;max-width:620px;margin:0 auto;display:flex;align-items:center;gap:8px;
  background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:0 6px 0 16px;height:40px;
}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(56,189,248,.15)}
.search svg{width:18px;height:18px;fill:var(--muted);flex:none}
.search input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:14px}
.search input::placeholder{color:var(--muted)}
.status-pill{
  font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;
  padding:5px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;
}
.status-pill.live{color:var(--ok);border-color:rgba(34,211,238,.35);background:rgba(34,211,238,.08)}
.status-pill.local{color:var(--warn);border-color:rgba(251,191,36,.35);background:rgba(251,191,36,.08)}

#authSlot{display:flex;align-items:center;flex:none;position:relative}
.signin-btn{
  display:flex;align-items:center;gap:8px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;font-weight:800;font-size:13px;letter-spacing:.2px;
  padding:9px 16px;border-radius:99px;white-space:nowrap;
  transition:filter .15s, transform .12s;
  box-shadow:0 4px 16px -4px rgba(56,189,248,.6);
}
.signin-btn:hover{filter:brightness(1.1)}
.signin-btn:active{transform:scale(.97)}
.signin-btn .pix{width:16px;height:16px;fill:#fff;opacity:.95}
.user-chip{
  display:flex;align-items:center;gap:8px;
  padding:3px 12px 3px 3px;border-radius:99px;
  background:var(--surface2);border:1px solid var(--line);
  transition:background .15s;max-width:220px;
}
.user-chip:hover{background:#1d2642}
.user-chip .pic{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:15px;overflow:hidden}
.user-chip .pic img{width:100%;height:100%;object-fit:cover}
.user-chip .nm{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-menu{
  position:absolute;top:calc(100% + 10px);right:0;
  background:var(--surface);border:1px solid var(--line);
  border-radius:14px;padding:6px;min-width:270px;
  max-height:80vh;overflow-y:auto;
  box-shadow:0 18px 50px rgba(0,0,0,.7);z-index:120;display:none;
}
.user-menu.open{display:block}
.user-menu .head{padding:12px 12px 14px;border-bottom:1px solid var(--line);margin-bottom:6px;display:flex;gap:10px;align-items:center}
.user-menu .head .pic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:18px;flex:none;overflow:hidden}
.user-menu .head .pic img{width:100%;height:100%;object-fit:cover}
.user-menu .head strong{display:block;font-size:14px;line-height:1.2}
.user-menu .head small{color:var(--muted);font-size:11.5px}
.user-menu button{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:10px 12px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--text);
}
.user-menu button:hover{background:var(--surface2)}
.user-menu button svg{width:17px;height:17px;fill:currentColor;opacity:.8}
.user-menu .sep{height:1px;background:var(--line);margin:6px 4px}

/* SHELL */
.shell{flex:1;display:flex;min-height:0}
.sidebar{
  width:236px;flex:none;overflow-y:auto;padding:10px 8px 24px;
  border-right:1px solid var(--line);background:var(--bg);
}
.sidebar h4{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);padding:16px 12px 8px}
.nav{display:flex;align-items:center;gap:14px;padding:10px 12px;border-radius:11px;font-size:14px;font-weight:500;transition:background .13s}
.nav:hover{background:var(--surface2)}
.nav.active{background:var(--surface2);font-weight:700;color:var(--accent)}
.nav svg{width:20px;height:20px;fill:currentColor;flex:none}
.nav .count{margin-left:auto;font-size:12px;color:var(--muted);font-weight:600}
.sub-row,.pl-row{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:11px;font-size:14px}
.sub-row:hover,.pl-row:hover{background:var(--surface2)}
.sub-row span.nm,.pl-row span.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#0b0b0f;font-size:14px;flex:none;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.sm{width:28px;height:28px;font-size:12px}
.avatar.lg{width:80px;height:80px;font-size:32px;border-radius:50%}
.side-note{padding:14px 12px;font-size:12px;color:var(--muted);line-height:1.6}
.side-user{display:flex;gap:10px;align-items:center;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:6px 4px 0}
.side-user .pic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:16px;flex:none;overflow:hidden}
.side-user .pic img{width:100%;height:100%;object-fit:cover}
.side-user .t{min-width:0}
.side-user strong{display:block;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-user small{color:var(--muted);font-size:11px}
.main{flex:1;min-width:0;overflow-y:auto;scroll-behavior:smooth}
.main.snap{scroll-snap-type:y mandatory}

/* PAGE HEAD */
.page-head{padding:22px 24px 0;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.page-head h1{font-size:23px;font-weight:800;letter-spacing:-.4px}
.page-head h2{font-size:16px;font-weight:800}
.page-head p{color:var(--muted);font-size:13px}

/* GRID */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:26px 16px;padding:20px 24px 40px}
.card{display:block;border-radius:var(--r)}
.card .thumb{
  position:relative;aspect-ratio:16/9;border-radius:13px;overflow:hidden;
  background:linear-gradient(135deg,#151d33,#1e2a4a);transition:transform .18s, box-shadow .18s;
}
.card:hover .thumb{transform:translateY(-3px);box-shadow:0 12px 30px -12px rgba(56,189,248,.4)}
.card .thumb img{width:100%;height:100%;object-fit:cover}
.card .thumb .placeholder{position:absolute;inset:0;display:grid;place-items:center;color:#3a4a6a;font-size:34px}
.card .dur{position:absolute;right:7px;bottom:7px;background:rgba(0,0,0,.85);padding:2px 6px;border-radius:6px;font-size:11.5px;font-weight:700}
.card .info{display:flex;gap:11px;padding:11px 4px 0}
.card h3{font-size:14.5px;font-weight:700;line-height:1.35;margin-bottom:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .sub{font-size:12.5px;color:var(--muted);line-height:1.5}
.card .sub:hover{color:var(--text)}

/* SHORTS SHELF */
.shorts-shelf{padding:10px 24px 6px}
.shorts-shelf .shelf-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.shorts-shelf .shelf-head .icon{
  width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
}
.shorts-shelf .shelf-head .icon svg{width:15px;height:15px;fill:#fff}
.shorts-shelf .shelf-head h2{font-size:18px;font-weight:900;letter-spacing:-.3px}
.shorts-rail{
  display:grid;grid-auto-flow:column;grid-auto-columns:180px;
  gap:12px;overflow-x:auto;padding-bottom:14px;scroll-snap-type:x mandatory;
}
.shorts-rail::-webkit-scrollbar{height:8px}
.short-card{scroll-snap-align:start;display:block;border-radius:12px;overflow:hidden;transition:transform .18s}
.short-card:hover{transform:translateY(-3px)}
.short-card .t{position:relative;aspect-ratio:9/16;border-radius:12px;overflow:hidden;background:linear-gradient(135deg,#151d33,#1e2a4a)}
.short-card .t img{width:100%;height:100%;object-fit:cover}
.short-card .t .placeholder{position:absolute;inset:0;display:grid;place-items:center;color:#3a4a6a;font-size:30px}
.short-card .t .badge{
  position:absolute;left:8px;top:8px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  padding:3px 8px;border-radius:99px;font-size:10px;font-weight:800;letter-spacing:.6px;
}
.short-card .t .views{
  position:absolute;left:8px;bottom:8px;
  background:rgba(0,0,0,.75);backdrop-filter:blur(4px);
  padding:3px 8px;border-radius:6px;font-size:11px;font-weight:700;
  display:flex;align-items:center;gap:5px;
}
.short-card .t .views svg{width:12px;height:12px;fill:#fff;opacity:.85}
.short-card h3{
  font-size:13px;font-weight:700;line-height:1.3;margin:9px 2px 3px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.short-card .sub{font-size:11.5px;color:var(--muted);margin:0 2px}

/* ---------- FOR YOU SHELF ---------- */
.for-you-shelf{padding:10px 24px 6px}
.for-you-shelf .shelf-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.for-you-shelf .shelf-head .icon{
  width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
  background:linear-gradient(135deg,#fbbf24,#f59e0b);
}
.for-you-shelf .shelf-head .icon svg{width:15px;height:15px;fill:#fff}
.for-you-shelf .shelf-head h2{font-size:18px;font-weight:900;letter-spacing:-.3px}
.for-you-shelf .clear-hist{
  margin-left:auto;font-size:12.5px;color:var(--muted);font-weight:700;
  padding:6px 12px;border-radius:99px;border:1px solid var(--line);transition:.15s;
}
.for-you-shelf .clear-hist:hover{background:var(--surface2);color:var(--text)}
.for-you-rail{
  display:grid;grid-auto-flow:column;grid-auto-columns:220px;
  gap:12px;overflow-x:auto;padding-bottom:14px;scroll-snap-type:x mandatory;
}
.for-you-rail::-webkit-scrollbar{height:8px}
.fy-card{scroll-snap-align:start;display:block;border-radius:12px;transition:transform .18s}
.fy-card:hover{transform:translateY(-3px)}
.fy-card .t{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:linear-gradient(135deg,#151d33,#1e2a4a)}
.fy-card .t img{width:100%;height:100%;object-fit:cover}
.fy-card .t .placeholder{position:absolute;inset:0;display:grid;place-items:center;color:#3a4a6a;font-size:26px}
.fy-card .t .dur{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.85);padding:2px 6px;border-radius:6px;font-size:11px;font-weight:700}
.fy-card h4{font-size:13.5px;font-weight:700;line-height:1.35;margin:9px 2px 3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fy-card .sub{font-size:11.5px;color:var(--muted);margin:0 2px}

/* ---------- CHANNEL SEARCH RESULTS ---------- */
.chan-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:14px;padding:16px 24px 20px;
}
.chan-card{
  display:flex;align-items:center;gap:16px;
  padding:14px 16px;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;transition:background .15s,border-color .15s;
}
.chan-card:hover{background:var(--surface2);border-color:var(--accent)}
.chan-card-info{min-width:0;flex:1}
.chan-card-info h3{font-size:15px;font-weight:800;line-height:1.3;margin-bottom:4px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chan-card-info .sub{font-size:12px;color:var(--muted)}

/* WATCH */
.watch{display:grid;grid-template-columns:minmax(0,1fr) 372px;gap:26px;padding:22px 24px 60px;max-width:1560px;margin:0 auto}
@media(max-width:1120px){.watch{grid-template-columns:1fr;padding:16px}}
.player{width:100%;aspect-ratio:16/9;background:#000;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);position:relative}
.player video{width:100%;height:100%;display:block;background:#000}
.player .loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:13px;background:#000}
.w-title{font-size:20px;font-weight:800;line-height:1.35;margin:16px 0 12px;letter-spacing:-.3px}
.w-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--line)}
.w-chan{display:flex;align-items:center;gap:12px;margin-right:auto;min-width:0}
.w-chan .nm{font-weight:700;font-size:14.5px}
.w-chan .sb{font-size:12px;color:var(--muted)}
.btn-sub{background:#fff;color:#0b0b0f;font-weight:800;font-size:13.5px;padding:9px 18px;border-radius:99px;transition:.15s;white-space:nowrap}
.btn-sub:hover{background:#cfe4ff}
.btn-sub.subbed{background:var(--surface2);color:var(--text);border:1px solid var(--line)}
.btn-sub.subbed:hover{background:#1d2642}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--line);border-radius:99px;padding:9px 16px;font-size:13.5px;font-weight:700;transition:.15s}
.pill:hover{background:#1d2642}
.pill svg{width:18px;height:18px;fill:currentColor}
.pill.active{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#fff}
.desc{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:13.5px;line-height:1.7;white-space:pre-line}
.desc .stats{font-weight:800;margin-bottom:8px;display:block;color:var(--text)}
.upnext h2{font-size:15px;font-weight:800;margin-bottom:14px}
.mini-card{display:flex;gap:10px;margin-bottom:12px;border-radius:10px;padding:4px;transition:background .14s}
.mini-card:hover{background:var(--surface)}
.mini-card .t{position:relative;width:158px;flex:none;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#151d33}
.mini-card .t img{width:100%;height:100%;object-fit:cover}
.mini-card .t .placeholder{position:absolute;inset:0;display:grid;place-items:center;color:#3a4a6a;font-size:22px}
.mini-card .t .dur{position:absolute;right:5px;bottom:5px;background:rgba(0,0,0,.85);padding:1px 5px;border-radius:5px;font-size:10.5px;font-weight:700}
.mini-card h4{font-size:13px;font-weight:700;line-height:1.35;margin-bottom:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mini-card .sub{font-size:11.5px;color:var(--muted)}

/* COMMENTS */
.comments{margin-top:24px}
.comments h2{font-size:16px;font-weight:800;margin-bottom:14px}
.comment-form{display:flex;gap:10px;margin-bottom:20px;align-items:flex-start}
.comment-form .pic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:16px;overflow:hidden}
.comment-form .pic img{width:100%;height:100%;object-fit:cover}
.comment-form .input-wrap{flex:1;min-width:0}
.comment-form textarea{
  width:100%;background:transparent;border:none;border-bottom:1px solid var(--line);
  color:var(--text);font-size:14px;padding:8px 4px;outline:none;resize:none;min-height:40px;
  font-family:inherit;
}
.comment-form textarea:focus{border-bottom-color:var(--accent)}
.comment-form .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}
.btn-primary{
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;
  font-weight:800;font-size:13px;padding:9px 18px;border-radius:99px;transition:.15s;
}
.btn-primary:hover{filter:brightness(1.1)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;filter:none}
.comment-list{display:flex;flex-direction:column;gap:16px}
.comment{display:flex;gap:11px}
.comment .pic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:16px;overflow:hidden}
.comment .pic img{width:100%;height:100%;object-fit:cover}
.comment .body{min-width:0;flex:1}
.comment .meta{font-size:12.5px;margin-bottom:3px}
.comment .meta b{font-weight:800}
.comment .meta span{color:var(--muted);margin-left:6px}
.comment .text{font-size:13.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.no-comments{color:var(--muted);font-size:13.5px;padding:14px 0}

/* MINIS */
.mini{height:calc(100vh - 56px);scroll-snap-align:start;display:grid;place-items:center}
.mini-inner{position:relative;width:min(432px,100%);height:100%;background:#000;overflow:hidden}
@media(min-width:900px){.mini{padding:16px 0}.mini-inner{height:100%;border-radius:20px;border:1px solid var(--line)}}
.mini video{width:100%;height:100%;object-fit:cover;background:#000;display:block}
.mini .shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to top,rgba(0,0,0,.85) 0%,rgba(0,0,0,0) 42%,rgba(0,0,0,.35) 100%)}
.mini .rail{position:absolute;right:12px;bottom:104px;display:flex;flex-direction:column;gap:18px;align-items:center}
.rail-btn{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;font-weight:700;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.8)}
.rail-btn .circ{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.14);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.16);transition:.15s}
.rail-btn:hover .circ{background:rgba(255,255,255,.26)}
.rail-btn svg{width:22px;height:22px;fill:#fff}
.rail-btn.active .circ{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent}
.mini .bottom{position:absolute;left:14px;right:78px;bottom:18px}
.mini .bottom .ch{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.mini .bottom .ch .nm{font-weight:800;font-size:13.5px;color:#fff}
.mini .bottom .ch .btn-sub{padding:6px 14px;font-size:12px}
.mini .bottom h3{font-size:14px;font-weight:600;line-height:1.45;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.7)}
.mini .bottom .views{color:rgba(255,255,255,.8);font-size:12px;margin-top:4px}
.mute-btn{position:absolute;top:14px;right:14px;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);font-size:16px;display:grid;place-items:center;color:#fff}
.mini .mini-close{
  position:absolute;top:14px;left:14px;z-index:5;
  width:38px;height:38px;border-radius:50%;
  background:rgba(0,0,0,.45);backdrop-filter:blur(6px);
  display:grid;place-items:center;color:#fff;font-size:15px;font-weight:700;
  text-decoration:none;
}
.mini .mini-close:hover{background:rgba(0,0,0,.65)}

/* CHANNEL */
.banner{height:170px;border-radius:0 0 18px 18px;position:relative;overflow:hidden;background-size:cover;background-position:center}
.banner::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent,rgba(10,14,26,.85))}
.chan-head{display:flex;align-items:center;gap:20px;padding:20px 24px 6px;flex-wrap:wrap}
.chan-head .txt{flex:1;min-width:200px}
.chan-head h1{font-size:26px;font-weight:900;letter-spacing:-.5px}
.chan-head .meta{color:var(--muted);font-size:13.5px;margin-top:6px}

/* CREATE FORM */
.form-wrap{max-width:640px;margin:0 auto;padding:32px 24px 60px}
.form-wrap h1{font-size:24px;font-weight:900;margin-bottom:6px;letter-spacing:-.4px}
.form-wrap .lede{color:var(--muted);font-size:13.5px;margin-bottom:22px;line-height:1.6}
.field{margin-bottom:18px}
.field label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:700;margin-bottom:7px}
.field input[type=text],.field input[type=url],.field textarea,.field select{
  width:100%;background:var(--surface);border:1px solid var(--line);border-radius:11px;
  color:var(--text);font-size:14px;padding:11px 14px;outline:none;transition:.15s;
  font-family:inherit;
}
.field textarea{resize:vertical;min-height:110px;line-height:1.55}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(56,189,248,.15)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:600px){.form-row{grid-template-columns:1fr}}
.form-actions{display:flex;justify-content:flex-end;gap:12px;margin-top:26px}
.btn-secondary{border:1px solid var(--line);border-radius:99px;padding:11px 22px;font-weight:700;font-size:13.5px;color:var(--text);transition:.15s}
.btn-secondary:hover{background:var(--surface2)}

/* SOURCE TABS */
.source-tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.source-tab{
  flex:1;min-width:120px;padding:10px 14px;border-radius:11px;font-size:13px;font-weight:700;
  background:var(--surface);border:1px solid var(--line);color:var(--muted);transition:.15s;
  text-align:center;
}
.source-tab.active{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  border-color:transparent;color:#fff;
}

/* DROPZONE */
.dropzone{
  position:relative;border:2px dashed var(--line);border-radius:14px;
  padding:34px 22px;text-align:center;transition:.18s;cursor:pointer;
  background:var(--surface);
}
.dropzone:hover,.dropzone.drag{border-color:var(--accent);background:rgba(56,189,248,.06)}
.dropzone.has-file{border-style:solid;border-color:var(--ok);background:rgba(34,211,238,.05)}
.dropzone .dz-icon{font-size:36px;margin-bottom:10px;opacity:.75}
.dropzone .dz-title{font-size:14px;font-weight:700;margin-bottom:4px}
.dropzone .dz-sub{font-size:12px;color:var(--muted)}
.dropzone .dz-file{display:flex;align-items:center;gap:12px;text-align:left;justify-content:center;margin-top:6px}
.dropzone .dz-file .nm{font-size:13.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:280px}
.dropzone .dz-file .sz{font-size:11.5px;color:var(--muted)}
.dropzone input[type=file]{display:none}
.progress{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-top:12px}
.progress .bar{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .2s}
.progress .lbl{font-size:12px;color:var(--muted);margin-top:8px;text-align:center}
.size-warn{font-size:12.5px;color:var(--warn);background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.3);border-radius:10px;padding:10px 14px;margin-top:12px}
.info-note{font-size:12.5px;color:var(--muted);background:var(--surface2);border-radius:10px;padding:10px 14px;line-height:1.55}

/* THUMB PREVIEW */
.thumb-preview{margin-bottom:14px;border-radius:12px;overflow:hidden;border:1px solid var(--line);aspect-ratio:16/9;background:#0f1526;position:relative}
.thumb-preview img{width:100%;height:100%;object-fit:cover;display:block}
.thumb-preview .empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:13px;text-align:center;padding:20px}
.thumb-preview .badge{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);color:#fff;font-size:11px;font-weight:800;letter-spacing:.4px;padding:4px 9px;border-radius:99px;text-transform:uppercase}

/* AVATAR PREVIEW */
.avatar-preview{display:flex;align-items:center;gap:16px;margin-bottom:14px}
.avatar-preview .av{width:72px;height:72px;border-radius:50%;overflow:hidden;flex:none;display:grid;place-items:center;font-weight:900;font-size:28px;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));border:2px solid var(--line)}
.avatar-preview .av img{width:100%;height:100%;object-fit:cover}
.avatar-preview .meta{flex:1;min-width:0}
.avatar-preview .meta strong{display:block;font-size:16px;font-weight:800}
.avatar-preview .meta small{color:var(--muted);font-size:12.5px}

/* PLAYLIST */
.playlist-header{padding:22px 24px 10px;display:flex;gap:20px;align-items:flex-end;flex-wrap:wrap}
.playlist-cover{width:220px;aspect-ratio:16/9;border-radius:14px;overflow:hidden;flex:none;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center}
.playlist-cover svg{width:60px;height:60px;fill:rgba(255,255,255,.9)}
.playlist-header .txt{flex:1;min-width:200px}
.playlist-header h1{font-size:28px;font-weight:900;letter-spacing:-.5px;margin-bottom:8px}
.playlist-header .meta{color:var(--muted);font-size:13.5px}
.playlist-videos{padding:14px 24px 40px;display:flex;flex-direction:column;gap:10px;max-width:1000px}
.pl-item{display:flex;gap:14px;padding:8px;border-radius:12px;transition:background .15s;align-items:center}
.pl-item:hover{background:var(--surface)}
.pl-item .idx{width:24px;text-align:center;color:var(--muted);font-size:13px;font-weight:700;flex:none}
.pl-item .t{position:relative;width:150px;flex:none;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#151d33}
.pl-item .t img{width:100%;height:100%;object-fit:cover}
.pl-item .t .placeholder{position:absolute;inset:0;display:grid;place-items:center;color:#3a4a6a;font-size:22px}
.pl-item .t .dur{position:absolute;right:5px;bottom:5px;background:rgba(0,0,0,.85);padding:1px 5px;border-radius:5px;font-size:10.5px;font-weight:700}
.pl-item .info{flex:1;min-width:0}
.pl-item h4{font-size:14px;font-weight:700;line-height:1.35;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl-item .sub{font-size:12px;color:var(--muted)}
.pl-item .remove{padding:8px 12px;border-radius:9px;color:var(--muted);font-size:12.5px;font-weight:600;flex:none}
.pl-item .remove:hover{background:rgba(56,189,248,.15);color:var(--accent)}

/* MODAL */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(6px);display:grid;place-items:center;z-index:300;padding:20px}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:18px;width:100%;max-width:440px;padding:24px;max-height:90vh;overflow-y:auto}
.modal h2{font-size:19px;font-weight:900;margin-bottom:6px;letter-spacing:-.3px}
.modal .lede{color:var(--muted);font-size:13px;margin-bottom:20px;line-height:1.55}
.modal .form-actions{margin-top:22px}
.modal .close{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.modal-wrap{position:relative}

/* EMPTY */
.empty{padding:80px 24px;text-align:center;color:var(--muted)}
.empty .big{font-size:46px;margin-bottom:14px}
.empty h2{color:var(--text);font-size:19px;margin-bottom:8px;font-weight:800}
.empty p{font-size:14px;margin-bottom:20px;line-height:1.6;max-width:460px;margin-left:auto;margin-right:auto}
.btn-ghost{border:1px solid var(--line);border-radius:99px;padding:10px 20px;font-weight:700;font-size:13.5px;color:var(--text);transition:.15s;display:inline-block}
.btn-ghost:hover{background:var(--surface2)}

/* TOAST */
#toast{
  position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);
  background:var(--surface2);border:1px solid var(--line);color:var(--text);
  padding:12px 22px;border-radius:99px;font-size:13.5px;font-weight:600;
  opacity:0;pointer-events:none;transition:.25s;z-index:400;box-shadow:0 12px 40px rgba(0,0,0,.6);
  max-width:90vw;text-align:center;
}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* STORAGE ALERT */
#storageAlert{
  position:fixed;top:56px;left:0;right:0;z-index:9000;
  background:linear-gradient(90deg,#fbbf24,#f59e0b);color:#0a0e1a;
  padding:10px 16px;font-size:13px;font-weight:700;
  display:flex;align-items:center;gap:10px;
  box-shadow:0 6px 20px rgba(0,0,0,.35);
}

@media(max-width:900px){
  .sidebar{position:fixed;top:56px;bottom:0;left:0;z-index:70;transform:translateX(-100%);transition:transform .22s;background:var(--bg)}
  body.nav-open .sidebar{transform:none;box-shadow:0 0 60px rgba(0,0,0,.8)}
  .logo-text{display:none}
  .status-pill{display:none}
  .grid{padding:16px;gap:22px 12px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
  .card h3{font-size:13.5px}
  .user-chip .nm{display:none}
  .shorts-rail{grid-auto-columns:150px}
  .for-you-rail{grid-auto-columns:170px}
  .chan-grid{grid-template-columns:1fr;padding:16px}
}
</style>
</head>
<body>

<!-- ============ LOADING SCREEN ============ -->
<div id="loader">
  <div class="inner">
    <img src="./logo.png" alt="PIXELTube" />
    <div class="name"><b>PIXEL</b>Tube</div>
    <div class="bar"></div>
    <div class="status" id="loaderStatus">Connecting to Firebase…</div>
  </div>
</div>

<header class="topbar">
  <button class="icon-btn" data-action="menu" aria-label="Menu" type="button">
    <svg viewBox="0 0 24 24"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
  </button>
  <a class="logo" href="#/">
    <span class="logo-mark"><img src="./logo.png" alt="PIXELTube" /></span>
    <span class="logo-text"><b>PIXEL</b>Tube</span>
  </a>
  <div class="search">
    <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
    <input id="searchInput" type="search" placeholder="Search videos, channels, and descriptions" autocomplete="off" />

</header>

<div class="shell">

  <main class="main" id="view"></main>
