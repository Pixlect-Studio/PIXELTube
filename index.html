<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PIXELTube</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b0b0f; --surface:#14141a; --surface2:#1e1e26; --line:#282833;
  --text:#f4f4f7; --muted:#9a9aab; --accent:#ff2d6f; --accent2:#7c4dff;
  --ok:#00e0b8; --warn:#ffb020; --r:14px;
}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text);
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit}
img{display:block}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#2c2c38;border-radius:20px}
::-webkit-scrollbar-track{background:transparent}

/* TOPBAR */
.topbar{
  height:56px;flex:none;display:flex;align-items:center;gap:10px;
  padding:0 14px;border-bottom:1px solid var(--line);
  background:rgba(11,11,15,.96);backdrop-filter:blur(10px);z-index:50;
}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;transition:background .15s;flex:none}
.icon-btn:hover{background:var(--surface2)}
.icon-btn svg{width:21px;height:21px;fill:currentColor}
.logo{display:flex;align-items:center;gap:8px;flex:none;margin-right:6px}
.logo-mark{
  width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  box-shadow:0 0 18px rgba(255,45,111,.45);
}
.logo-mark svg{width:15px;height:15px;fill:#fff;margin-left:2px}
.logo-text{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:19px;font-weight:700;letter-spacing:-.6px}
.logo-text b{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.search{
  flex:1;max-width:620px;margin:0 auto;display:flex;align-items:center;gap:8px;
  background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:0 6px 0 16px;height:40px;
}
.search:focus-within{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(124,77,255,.15)}
.search svg{width:18px;height:18px;fill:var(--muted);flex:none}
.search input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:14px}
.search input::placeholder{color:var(--muted)}
.status-pill{
  font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;
  padding:5px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;
}
.status-pill.live{color:var(--ok);border-color:rgba(0,224,184,.35);background:rgba(0,224,184,.08)}
.status-pill.local{color:var(--warn);border-color:rgba(255,176,32,.35);background:rgba(255,176,32,.08)}

#authSlot{display:flex;align-items:center;flex:none;position:relative}
.signin-btn{
  display:flex;align-items:center;gap:8px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;font-weight:800;font-size:13px;letter-spacing:.2px;
  padding:9px 16px;border-radius:99px;white-space:nowrap;
  transition:filter .15s, transform .12s;
  box-shadow:0 4px 16px -4px rgba(255,45,111,.6);
}
.signin-btn:hover{filter:brightness(1.1)}
.signin-btn:active{transform:scale(.97)}
.signin-btn .pix{width:16px;height:16px;fill:#fff;opacity:.95}
.user-chip{
  display:flex;align-items:center;gap:8px;
  padding:3px 12px 3px 3px;border-radius:99px;
  background:var(--surface2);border:1px solid var(--line);
  transition:background .15s;max-width:220px;
}
.user-chip:hover{background:#2a2a36}
.user-chip .pic{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:15px;overflow:hidden}
.user-chip .pic img{width:100%;height:100%;object-fit:cover}
.user-chip .nm{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-menu{
  position:absolute;top:calc(100% + 10px);right:0;
  background:var(--surface);border:1px solid var(--line);
  border-radius:14px;padding:6px;min-width:250px;
  box-shadow:0 18px 50px rgba(0,0,0,.7);z-index:120;display:none;
}
.user-menu.open{display:block}
.user-menu .head{padding:12px 12px 14px;border-bottom:1px solid var(--line);margin-bottom:6px;display:flex;gap:10px;align-items:center}
.user-menu .head .pic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:18px;flex:none;overflow:hidden}
.user-menu .head .pic img{width:100%;height:100%;object-fit:cover}
.user-menu .head strong{display:block;font-size:14px;line-height:1.2}
.user-menu .head small{color:var(--muted);font-size:11.5px}
.user-menu button{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:10px 12px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--text);
}
.user-menu button:hover{background:var(--surface2)}
.user-menu button svg{width:17px;height:17px;fill:currentColor;opacity:.8}
.user-menu .sep{height:1px;background:var(--line);margin:6px 4px}

/* SHELL */
.shell{flex:1;display:flex;min-height:0}
.sidebar{
  width:236px;flex:none;overflow-y:auto;padding:10px 8px 24px;
  border-right:1px solid var(--line);background:var(--bg);
}
.sidebar h4{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);padding:16px 12px 8px}
.nav{display:flex;align-items:center;gap:14px;padding:10px 12px;border-radius:11px;font-size:14px;font-weight:500;transition:background .13s}
.nav:hover{background:var(--surface2)}
.nav.active{background:var(--surface2);font-weight:700}
.nav svg{width:20px;height:20px;fill:currentColor;flex:none}
.nav .count{margin-left:auto;font-size:12px;color:var(--muted);font-weight:600}
.sub-row,.pl-row{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:11px;font-size:14px}
.sub-row:hover,.pl-row:hover{background:var(--surface2)}
.sub-row span.nm,.pl-row span.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#0b0b0f;font-size:14px;flex:none;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.sm{width:28px;height:28px;font-size:12px}
.avatar.lg{width:80px;height:80px;font-size:32px;border-radius:50%}
.side-note{padding:14px 12px;font-size:12px;color:var(--muted);line-height:1.6}
.side-user{display:flex;gap:10px;align-items:center;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:6px 4px 0}
.side-user .pic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:16px;flex:none;overflow:hidden}
.side-user .pic img{width:100%;height:100%;object-fit:cover}
.side-user .t{min-width:0}
.side-user strong{display:block;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-user small{color:var(--muted);font-size:11px}
.main{flex:1;min-width:0;overflow-y:auto;scroll-behavior:smooth}
.main.snap{scroll-snap-type:y mandatory}

/* PAGE HEAD */
.page-head{padding:22px 24px 0;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.page-head h1{font-size:23px;font-weight:800;letter-spacing:-.4px}
.page-head p{color:var(--muted);font-size:13px}

/* GRID */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:26px 16px;padding:20px 24px 40px}
.card{display:block;border-radius:var(--r)}
.card .thumb{
  position:relative;aspect-ratio:16/9;border-radius:13px;overflow:hidden;
  background:linear-gradient(135deg,#1d1d28,#2c2c3d);transition:transform .18s, box-shadow .18s;
}
.card:hover .thumb{transform:translateY(-3px);box-shadow:0 12px 30px -12px rgba(0,0,0,.9)}
.card .thumb img{width:100%;height:100%;object-fit:cover}
.card .thumb .placeholder{
  position:absolute;inset:0;display:grid;place-items:center;
  color:#3a3a4a;font-size:34px;
}
.card .dur{position:absolute;right:7px;bottom:7px;background:rgba(0,0,0,.85);padding:2px 6px;border-radius:6px;font-size:11.5px;font-weight:700}
.card .kind{position:absolute;left:7px;top:7px;background:linear-gradient(135deg,var(--accent),var(--accent2));padding:3px 8px;border-radius:99px;font-size:10px;font-weight:800;letter-spacing:.6px}
.card .info{display:flex;gap:11px;padding:11px 4px 0}
.card h3{font-size:14.5px;font-weight:700;line-height:1.35;margin-bottom:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .sub{font-size:12.5px;color:var(--muted);line-height:1.5}
.card .sub:hover{color:var(--text)}

/* SHORTS SHELF */
.shorts-shelf{padding:10px 24px 6px}
.shorts-shelf .shelf-head{
  display:flex;align-items:center;gap:10px;margin-bottom:14px;
}
.shorts-shelf .shelf-head .icon{
  width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
}
.shorts-shelf .shelf-head .icon svg{width:15px;height:15px;fill:#fff}
.shorts-shelf .shelf-head h2{font-size:18px;font-weight:900;letter-spacing:-.3px}
.shorts-rail{
  display:grid;grid-auto-flow:column;grid-auto-columns:180px;
  gap:12px;overflow-x:auto;padding-bottom:14px;scroll-snap-type:x mandatory;
}
.shorts-rail::-webkit-scrollbar{height:8px}
.short-card{
  scroll-snap-align:start;display:block;border-radius:12px;overflow:hidden;
  transition:transform .18s;
}
.short-card:hover{transform:translateY(-3px)}
.short-card .t{
  position:relative;aspect-ratio:9/16;border-radius:12px;overflow:hidden;
  background:linear-gradient(135deg,#1d1d28,#2c2c3d);
}
.short-card .t img{width:100%;height:100%;object-fit:cover}
.short-card .t .placeholder{position:absolute;inset:0;display:grid;place-items:center;color:#3a3a4a;font-size:30px}
.short-card .t .badge{
  position:absolute;left:8px;top:8px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  padding:3px 8px;border-radius:99px;font-size:10px;font-weight:800;letter-spacing:.6px;
}
.short-card .t .views{
  position:absolute;left:8px;bottom:8px;
  background:rgba(0,0,0,.75);backdrop-filter:blur(4px);
  padding:3px 8px;border-radius:6px;font-size:11px;font-weight:700;
  display:flex;align-items:center;gap:5px;
}
.short-card .t .views svg{width:12px;height:12px;fill:#fff;opacity:.85}
.short-card h3{
  font-size:13px;font-weight:700;line-height:1.3;margin:9px 2px 3px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.short-card .sub{font-size:11.5px;color:var(--muted);margin:0 2px}

/* WATCH */
.watch{display:grid;grid-template-columns:minmax(0,1fr) 372px;gap:26px;padding:22px 24px 60px;max-width:1560px;margin:0 auto}
@media(max-width:1120px){.watch{grid-template-columns:1fr;padding:16px}}
.player{width:100%;aspect-ratio:16/9;background:#000;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);position:relative}
.player video{width:100%;height:100%;display:block;background:#000}
.player .loading{
  position:absolute;inset:0;display:grid;place-items:center;
  color:var(--muted);font-size:13px;background:#000;
}
.w-title{font-size:20px;font-weight:800;line-height:1.35;margin:16px 0 12px;letter-spacing:-.3px}
.w-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--line)}
.w-chan{display:flex;align-items:center;gap:12px;margin-right:auto;min-width:0}
.w-chan .nm{font-weight:700;font-size:14.5px}
.w-chan .sb{font-size:12px;color:var(--muted)}
.btn-sub{background:#fff;color:#0b0b0f;font-weight:800;font-size:13.5px;padding:9px 18px;border-radius:99px;transition:.15s;white-space:nowrap}
.btn-sub:hover{background:#dcdce4}
.btn-sub.subbed{background:var(--surface2);color:var(--text);border:1px solid var(--line)}
.btn-sub.subbed:hover{background:#2a2a36}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--line);border-radius:99px;padding:9px 16px;font-size:13.5px;font-weight:700;transition:.15s}
.pill:hover{background:#2a2a36}
.pill svg{width:18px;height:18px;fill:currentColor}
.pill.active{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#fff}
.desc{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:13.5px;line-height:1.7;white-space:pre-line}
.desc .stats{font-weight:800;margin-bottom:8px;display:block;color:var(--text)}
.upnext h2{font-size:15px;font-weight:800;margin-bottom:14px}
.mini-card{display:flex;gap:10px;margin-bottom:12px;border-radius:10px;padding:4px;transition:background .14s}
.mini-card:hover{background:var(--surface)}
.mini-card .t{position:relative;width:158px;flex:none;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#1d1d28}
.mini-card .t img{width:100%;height:100%;object-fit:cover}
.mini-card .t .placeholder{position:absolute;inset:0;display:grid;place-items:center;color:#3a3a4a;font-size:22px}
.mini-card .t .dur{position:absolute;right:5px;bottom:5px;background:rgba(0,0,0,.85);padding:1px 5px;border-radius:5px;font-size:10.5px;font-weight:700}
.mini-card h4{font-size:13px;font-weight:700;line-height:1.35;margin-bottom:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mini-card .sub{font-size:11.5px;color:var(--muted)}

/* COMMENTS */
.comments{margin-top:24px}
.comments h2{font-size:16px;font-weight:800;margin-bottom:14px}
.comment-form{display:flex;gap:10px;margin-bottom:20px;align-items:flex-start}
.comment-form .pic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:16px;overflow:hidden}
.comment-form .pic img{width:100%;height:100%;object-fit:cover}
.comment-form .input-wrap{flex:1;min-width:0}
.comment-form textarea{
  width:100%;background:transparent;border:none;border-bottom:1px solid var(--line);
  color:var(--text);font-size:14px;padding:8px 4px;outline:none;resize:none;min-height:40px;
  font-family:inherit;
}
.comment-form textarea:focus{border-bottom-color:var(--accent2)}
.comment-form .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}
.btn-primary{
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;
  font-weight:800;font-size:13px;padding:9px 18px;border-radius:99px;transition:.15s;
}
.btn-primary:hover{filter:brightness(1.1)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;filter:none}
.comment-list{display:flex;flex-direction:column;gap:16px}
.comment{display:flex;gap:11px}
.comment .pic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:16px;overflow:hidden}
.comment .pic img{width:100%;height:100%;object-fit:cover}
.comment .body{min-width:0;flex:1}
.comment .meta{font-size:12.5px;margin-bottom:3px}
.comment .meta b{font-weight:800}
.comment .meta span{color:var(--muted);margin-left:6px}
.comment .text{font-size:13.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.no-comments{color:var(--muted);font-size:13.5px;padding:14px 0}

/* MINIS FEED */
.mini{height:calc(100vh - 56px);scroll-snap-align:start;display:grid;place-items:center}
.mini-inner{position:relative;width:min(432px,100%);height:100%;background:#000;overflow:hidden}
@media(min-width:900px){.mini{padding:16px 0}.mini-inner{height:100%;border-radius:20px;border:1px solid var(--line)}}
.mini video{width:100%;height:100%;object-fit:cover;background:#000;display:block}
.mini .shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to top,rgba(0,0,0,.85) 0%,rgba(0,0,0,0) 42%,rgba(0,0,0,.35) 100%)}
.mini .rail{position:absolute;right:12px;bottom:104px;display:flex;flex-direction:column;gap:18px;align-items:center}
.rail-btn{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;font-weight:700;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.8)}
.rail-btn .circ{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.14);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.16);transition:.15s}
.rail-btn:hover .circ{background:rgba(255,255,255,.26)}
.rail-btn svg{width:22px;height:22px;fill:#fff}
.rail-btn.active .circ{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent}
.mini .bottom{position:absolute;left:14px;right:78px;bottom:18px}
.mini .bottom .ch{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.mini .bottom .ch .nm{font-weight:800;font-size:13.5px;color:#fff}
.mini .bottom .ch .btn-sub{padding:6px 14px;font-size:12px}
.mini .bottom h3{font-size:14px;font-weight:600;line-height:1.45;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.7)}
.mini .bottom .views{color:rgba(255,255,255,.8);font-size:12px;margin-top:4px}
.mute-btn{position:absolute;top:14px;right:14px;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);font-size:16px;display:grid;place-items:center;color:#fff}

/* CHANNEL */
.banner{height:170px;border-radius:0 0 18px 18px;position:relative;overflow:hidden;background-size:cover;background-position:center}
.banner::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent,rgba(11,11,15,.85))}
.chan-head{display:flex;align-items:center;gap:20px;padding:20px 24px 6px;flex-wrap:wrap}
.chan-head .txt{flex:1;min-width:200px}
.chan-head h1{font-size:26px;font-weight:900;letter-spacing:-.5px}
.chan-head .meta{color:var(--muted);font-size:13.5px;margin-top:6px}

/* FORMS */
.form-wrap{max-width:640px;margin:0 auto;padding:32px 24px 60px}
.form-wrap h1{font-size:24px;font-weight:900;margin-bottom:6px;letter-spacing:-.4px}
.form-wrap .lede{color:var(--muted);font-size:13.5px;margin-bottom:22px;line-height:1.6}
.field{margin-bottom:18px}
.field label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:700;margin-bottom:7px}
.field input[type=text],.field input[type=url],.field textarea,.field select{
  width:100%;background:var(--surface);border:1px solid var(--line);border-radius:11px;
  color:var(--text);font-size:14px;padding:11px 14px;outline:none;transition:.15s;
  font-family:inherit;
}
.field textarea{resize:vertical;min-height:110px;line-height:1.55}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(124,77,255,.15)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:600px){.form-row{grid-template-columns:1fr}}
.form-actions{display:flex;justify-content:flex-end;gap:12px;margin-top:26px}
.btn-secondary{border:1px solid var(--line);border-radius:99px;padding:11px 22px;font-weight:700;font-size:13.5px;color:var(--text);transition:.15s}
.btn-secondary:hover{background:var(--surface2)}

/* SOURCE TABS */
.source-tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.source-tab{
  flex:1;min-width:120px;padding:10px 14px;border-radius:11px;font-size:13px;font-weight:700;
  background:var(--surface);border:1px solid var(--line);color:var(--muted);transition:.15s;
  text-align:center;
}
.source-tab.active{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  border-color:transparent;color:#fff;
}

/* DROPZONE */
.dropzone{
  position:relative;border:2px dashed var(--line);border-radius:14px;
  padding:34px 22px;text-align:center;transition:.18s;cursor:pointer;
  background:var(--surface);
}
.dropzone:hover,.dropzone.drag{border-color:var(--accent2);background:rgba(124,77,255,.06)}
.dropzone.has-file{border-style:solid;border-color:var(--ok);background:rgba(0,224,184,.05)}
.dropzone .dz-icon{font-size:36px;margin-bottom:10px;opacity:.75}
.dropzone .dz-title{font-size:14px;font-weight:700;margin-bottom:4px}
.dropzone .dz-sub{font-size:12px;color:var(--muted)}
.dropzone .dz-file{

<script type="module">
/* ============================================================
   PIXELTube — Firebase Realtime DB + PIXLECT popup auth
   ============================================================ */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getDatabase, ref, onValue, get, set, remove, update, runTransaction, push
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* ---------- FIREBASE CONFIG ---------- */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDGIlsepztfV5Puuqu2ZFuyghS6VQ-MbQo",
  authDomain: "pixgpt-cf8e9.firebaseapp.com",
  databaseURL: "https://pixgpt-cf8e9-default-rtdb.firebaseio.com",
  projectId: "pixgpt-cf8e9",
  storageBucket: "pixgpt-cf8e9.firebasestorage.app",
  messagingSenderId: "553975841772",
  appId: "1:553975841772:web:5c7013ad266487da6836c9"
};

/* ============================================================
   PIXLECT AUTH
   ============================================================ */
const PIXLECT = {
  AUTH_URL: 'http://www.account.pixlect-studios.com/?app=PixelTube&mode=popup',
  ORIGIN:   'http://www.account.pixlect-studios.com',
  APP:      'PixelTube',
  user:     null
};

try {
  const raw = localStorage.getItem('pixeltube_pixlect');
  if (raw) PIXLECT.user = JSON.parse(raw);
} catch (_) {}

function getLocalUid() {
  let u = localStorage.getItem('pixeltube_uid');
  if (!u) {
    u = 'u_' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
    localStorage.setItem('pixeltube_uid', u);
  }
  return u;
}

function pixlectSignIn() {
  const w = 520, h = 640;
  const left = (screen.width  - w) / 2;
  const top  = (screen.height - h) / 2;
  window.open(PIXLECT.AUTH_URL, 'pixlect-auth',
    `width=${w},height=${h},left=${left},top=${top},popup=yes,resizable=yes,scrollbars=yes`);
}

function pixlectSignOut() {
  PIXLECT.user = null;
  localStorage.removeItem('pixeltube_pixlect');
  state.uid = getLocalUid();
  reloadUserScopedData();
  renderTopbar();
  renderSidebar();
  render(true);
  toast('Signed out');
}

function handlePixlectMessage(d) {
  if (!d || typeof d !== 'object') return false;
  console.log('[PIXLECT] message received:', d);

  let user = null;
  if (d.type === 'PIXLECT_AUTH' && d.app === PIXLECT.APP && d.status === 'success' && d.user) user = d.user;
  else if (d.source === 'pixlect' && d.user) user = d.user;
  else if (d.username && (d.uid || d.id)) user = { username: d.username, uid: d.uid || d.id, icon: d.icon };
  else if (d.payload && d.payload.user) user = d.payload.user;

  if (!user) return false;

  const clean = {
    username: String(user.username || user.name || 'user'),
    uid:      String(user.uid || user.id || ''),
    icon:     user.icon || { bg: '#7c4dff', emoji: '👤' }
  };
  if (!clean.uid) return false;

  PIXLECT.user = clean;
  localStorage.setItem('pixeltube_pixlect', JSON.stringify(clean));

  state.uid = 'pl_' + clean.uid;
  reloadUserScopedData();
  renderTopbar();
  renderSidebar();
  render(true);
  toast('Signed in as ' + clean.username);
  return true;
}

window.addEventListener('message', (ev) => {
  const okOrigin =
    ev.origin === 'http://www.account.pixlect-studios.com' ||
    ev.origin === 'https://www.account.pixlect-studios.com' ||
    ev.origin === 'http://account.pixlect-studios.com' ||
    ev.origin === 'https://account.pixlect-studios.com';
  if (!okOrigin) return;
  handlePixlectMessage(ev.data);
});

/* ============================================================
   STATE
   ============================================================ */
const state = {
  uid: PIXLECT.user ? ('pl_' + PIXLECT.user.uid) : getLocalUid(),
  mode: 'connecting',
  videos: {}, channels: {}, playlists: {}, subs: {}, likes: {},
  search: '', route: ['home'],
  viewedThisSession: new Set()
};
let db = null;
let localDB = null;
let lastData = null;
let commentsUnsub = null;
const srcCache = {};

/* ---------- HELPERS ---------- */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const initial = s => (s || '?').trim().charAt(0).toUpperCase();

function fmt(n) {
  n = Number(n) || 0;
  if (n >= 1e9) return (n / 1e9).toFixed(1).replace(/\.0$/, '') + 'B';
  if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(1).replace(/\.0$/, '') + 'K';
  return String(n);
}
function fmtBytes(n) {
  if (!n) return '0 B';
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
  return (n / 1048576).toFixed(1) + ' MB';
}
function timeAgo(ts) {
  if (!ts) return 'just now';
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 5)     return 'just now';
  if (s < 60)    return s + 's ago';
  if (s < 3600)  return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  if (s < 2592000) return Math.floor(s / 86400) + 'd ago';
  if (s < 31536000) return Math.floor(s / 2592000) + 'mo ago';
  return Math.floor(s / 31536000) + 'y ago';
}
function parseDuration(str) {
  if (!str) return 0;
  const parts = String(str).split(':').map(p => parseInt(p, 10) || 0);
  if (parts.length === 3) return parts[0]*3600 + parts[1]*60 + parts[2];
  if (parts.length === 2) return parts[0]*60 + parts[1];
  return parts[0] || 0;
}

const subsOf   = cid => (state.channels[cid]?.subs) || 0;
const likesOf  = vid => (state.videos[vid]?.likes) || 0;
const viewsOf  = vid => (state.videos[vid]?.views) || 0;
const isSubbed = cid => !!state.subs[cid];
const isLiked  = vid => !!state.likes[vid];
const chanOf   = vid => state.channels[state.videos[vid]?.channelId] || { name: 'Unknown', color: '#555' };

function avatarHTML(c, cls = '') {
  if (c?.avatar) {
    return `<span class="avatar ${cls}"><img src="${esc(c.avatar)}" alt=""></span>`;
  }
  return `<span class="avatar ${cls}" style="background:${esc(c?.color || '#666')}">${esc(initial(c?.name))}</span>`;
}
function userAvatarHTML(user, cls = '') {
  if (user?.icon?.avatar) return `<span class="avatar ${cls}"><img src="${esc(user.icon.avatar)}" alt=""></span>`;
  return `<span class="avatar ${cls}" style="background:${esc(user?.icon?.bg || '#666')}">${esc(user?.icon?.emoji || initial(user?.username))}</span>`;
}
function thumbHTML(v) {
  if (v.thumb) {
    return `<img src="${esc(v.thumb)}" alt="" loading="lazy"
                 crossorigin="anonymous" referrerpolicy="no-referrer"
                 onerror="this.parentElement.insertAdjacentHTML('beforeend','<div class=\\'placeholder\\'>🎬</div>');this.remove()">`;
  }
  return `<div class="placeholder">🎬</div>`;
}

function videosSorted() {
  return Object.values(state.videos).sort((a, b) => (b.createdAt || b.ord || 0) - (a.createdAt || a.ord || 0));
}
function minisSorted() {
  return videosSorted().filter(v => v.kind === 'mini');
}
function longsSorted() {
  return videosSorted().filter(v => v.kind !== 'mini');
}

let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

/* ============================================================
   MODAL
   ============================================================ */
function openModal(html) {
  const root = $('#modalRoot');
  root.innerHTML = `<div class="modal-backdrop" data-modal-backdrop>
    <div class="modal-wrap"><div class="modal">${html}</div></div>
  </div>`;
}
function closeModal() {
  $('#modalRoot').innerHTML = '';
}
document.addEventListener('click', (e) => {
  if (e.target.matches('[data-modal-backdrop]')) closeModal();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});

/* ============================================================
   THUMBNAIL GENERATION
   ============================================================ */
const THUMB_MAX_W = 480;
const THUMB_QUALITY = 0.75;

function captureThumbnailFromFile(file) {
  return new Promise((resolve) => {
    const url = URL.createObjectURL(file);
    const video = document.createElement('video');
    video.preload = 'metadata';
    video.muted = true;
    video.playsInline = true;
    video.src = url;
    const cleanup = (result) => {
      try { URL.revokeObjectURL(url); } catch (_) {}
      video.removeAttribute('src');
      video.load();
      resolve(result);
    };
    const timeout = setTimeout(() => cleanup(''), 8000);
    video.addEventListener('loadedmetadata', () => {
      const dur = isFinite(video.duration) && video.duration > 0 ? video.duration : 1;
      const target = Math.max(0.5, Math.min(dur * 0.2, dur - 0.1));
      try { video.currentTime = target; } catch (_) { clearTimeout(timeout); cleanup(''); }
    }, { once: true });
    video.addEventListener('seeked', () => {
      clearTimeout(timeout);
      try {
        const vw = video.videoWidth || 640;
        const vh = video.videoHeight || 360;
        const scale = Math.min(1, THUMB_MAX_W / vw);
        const w = Math.round(vw * scale);
        const h = Math.round(vh * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(video, 0, 0, w, h);
        cleanup(canvas.toDataURL('image/jpeg', THUMB_QUALITY));
      } catch (e) { cleanup(''); }
    }, { once: true });
    video.addEventListener('error', () => { clearTimeout(timeout); cleanup(''); }, { once: true });
  });
}

function readFileAsDataURL(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function resizeImageFile(file, maxW = THUMB_MAX_W) {
  return new Promise((resolve) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      try {
        const scale = Math.min(1, maxW / img.width);
        const w = Math.round(img.width * scale);
        const h = Math.round(img.height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        const dataUrl = canvas.toDataURL('image/jpeg', THUMB_QUALITY);
        URL.revokeObjectURL(url);
        resolve(dataUrl);
      } catch (e) { URL.revokeObjectURL(url); resolve(''); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(''); };
    img.src = url;
  });
}

/* ============================================================
   VIDEO SOURCE CACHE
   ============================================================ */
async function fetchVideoSrc(vid) {
  if (srcCache[vid] !== undefined) return srcCache[vid];
  if (state.mode === 'firebase' && db) {
    try {
      const snap = await get(ref(db, `pixeltube/videoSrc/${vid}`));
      srcCache[vid] = snap.val() || '';
    } catch (e) { srcCache[vid] = ''; }
  } else if (localDB) {
    srcCache[vid] = (localDB.videoSrc && localDB.videoSrc[vid]) || '';
  } else {
    srcCache[vid] = '';
  }
  return srcCache[vid];
}

async function hydrateVideosInView(root) {
  const vids = $$('video[data-vid]', root || document);
  await Promise.all(vids.map(async (v) => {
    const vid = v.dataset.vid;
    if (v.dataset.hydrated === '1') return;
    v.dataset.hydrated = '1';
    const src = await fetchVideoSrc(vid);
    if (src) {
      v.src = src;
      const loading = v.parentElement.querySelector('.loading');
      if (loading) loading.remove();
    } else {
      const loading = v.parentElement.querySelector('.loading');
      if (loading) loading.textContent = 'Video source unavailable';
      v.remove();
    }
  }));
}

async function registerView(vid) {
  if (!vid) return;
  if (state.viewedThisSession.has(vid)) return;
  state.viewedThisSession.add(vid);

  if (state.mode === 'firebase' && db) {
    try {
      await runTransaction(ref(db, `pixeltube/videos/${vid}/views`), n => (Number(n) || 0) + 1);
    } catch (e) { console.warn('view increment failed', e); }
  } else if (state.mode === 'local' && localDB) {
    const v = localDB.videos[vid];
    if (v) {
      v.views = (Number(v.views) || 0) + 1;
      persistLocal();
      applyData(localDB);
    }
  }
}

/* ============================================================
   DATA LAYER
   ============================================================ */
async function boot() {
  try {
    const app = initializeApp(FIREBASE_CONFIG);
    db = getDatabase(app);
    state.mode = 'firebase';
    const rootRef = ref(db, 'pixeltube');
    onValue(rootRef,
      s => applyData(s.val() || {}),
      err => console.warn('[PIXELTube] stream error:', err)
    );
    setStatus();
  } catch (e) {
    console.warn('[PIXELTube] Firebase unavailable → local mode.', e);
    bootLocal();
  }
}

function bootLocal() {
  state.mode = 'local';
  let raw = null;
  try { raw = JSON.parse(localStorage.getItem('pixeltube_db') || 'null'); } catch (_) {}
  if (!raw) raw = { channels: {}, videos: {}, videoSrc: {}, users: {}, comments: {}, playlists: {} };
  localDB = raw;
  applyData(localDB);
  setStatus();
}

function persistLocal() {
  try { localStorage.setItem('pixeltube_db', JSON.stringify(localDB)); } catch (_) {}
}

function applyData(d) {
  lastData = d;
  state.videos    = d.videos    || {};
  state.channels  = d.channels  || {};
  state.playlists = d.playlists || {};
  const u = (d.users && d.users[state.uid]) || {};
  state.subs  = u.subs  || {};
  state.likes = u.likes || {};
  renderSidebar();
  render();
}

function reloadUserScopedData() {
  if (state.mode === 'local' && localDB) applyData(localDB);
  else if (lastData) applyData(lastData);
}

function setStatus() {
  const p = $('#statusPill');
  if (state.mode === 'firebase') { p.textContent = 'Realtime DB'; p.className = 'status-pill live'; }
  else if (state.mode === 'local') { p.textContent = 'Local mode'; p.className = 'status-pill local'; }
  else { p.textContent = 'connecting'; p.className = 'status-pill'; }
}

/* ============================================================
   CHANNEL / USER
   ============================================================ */
function myChannelId() {
  return PIXLECT.user ? ('pl_' + PIXLECT.user.uid) : null;
}
function myChannel() {
  const cid = myChannelId();
  return cid ? state.channels[cid] : null;
}
function hasChannel() {
  return !!myChannel();
}

async function createOrUpdateChannel(data) {
  const cid = myChannelId();
  if (!cid) return;
  const existing = state.channels[cid] || {};
  const ch = {
    id: cid,
    name: data.name || existing.name || PIXLECT.user.username,
    handle: data.handle || existing.handle || ('@' + PIXLECT.user.username),
    color: data.color || existing.color || (PIXLECT.user.icon?.bg || '#7c4dff'),
    avatar: data.avatar !== undefined ? data.avatar : (existing.avatar || ''),
    banner: data.banner !== undefined ? data.banner : (existing.banner || ''),
    subs: existing.subs || 0,
    ownerUid: PIXLECT.user.uid,
    createdAt: existing.createdAt || Date.now()
  };
  if (state.mode === 'firebase' && db) {
    try { await set(ref(db, `pixeltube/channels/${cid}`), ch); }
    catch (e) { console.warn('channel save failed', e); toast('Could not save channel'); }
  } else if (state.mode === 'local' && localDB) {
    localDB.channels[cid] = ch;
    persistLocal();
    applyData(localDB);
  }
}

/* ============================================================
   ACTIONS
   ============================================================ */
async function toggleSub(cid) {
  if (!cid) return;
  if (!PIXLECT.user) { toast('Sign in with PIXLECT to subscribe'); pixlectSignIn(); return; }
  const on = isSubbed(cid);
  const delta = on ? -1 : 1;

  if (state.mode === 'firebase') {
    try {
      const p = `pixeltube/users/${state.uid}/subs/${cid}`;
      if (on) await remove(ref(db, p));
      else    await set(ref(db, p), true);
      await runTransaction(ref(db, `pixeltube/channels/${cid}/subs`),
        n => Math.max(0, (Number(n) || 0) + delta));
      toast(on ? 'Unsubscribed' : 'Subscribed 🔔');
    } catch (e) { console.warn(e); toast('Could not update subscription'); }
  } else {
    const u = localDB.users[state.uid] || (localDB.users[state.uid] = {});
    const s = u.subs || (u.subs = {});
    if (on) delete s[cid]; else s[cid] = true;
    const ch = localDB.channels[cid];
    if (ch) ch.subs = Math.max(0, (Number(ch.subs) || 0) + delta);
    persistLocal();
    applyData(localDB);
    toast(on ? 'Unsubscribed' : 'Subscribed 🔔');
  }
}

async function toggleLike(vid) {
  if (!vid) return;
  if (!PIXLECT.user) { toast('Sign in with PIXLECT to like'); pixlectSignIn(); return; }
  const on = isLiked(vid);
  const delta = on ? -1 : 1;

  if (state.mode === 'firebase') {
    try {
      const p = `pixeltube/users/${state.uid}/likes/${vid}`;
      if (on) await remove(ref(db, p));
      else    await set(ref(db, p), true);
      await runTransaction(ref(db, `pixeltube/videos/${vid}/likes`),
        n => Math.max(0, (Number(n) || 0) + delta));
    } catch (e) { console.warn(e); toast('Could not update like'); }
  } else {
    const u = localDB.users[state.uid] || (localDB.users[state.uid] = {});
    const l = u.likes || (u.likes = {});
    if (on) delete l[vid]; else l[vid] = true;
    const v = localDB.videos[vid];
    if (v) v.likes = Math.max(0, (Number(v.likes) || 0) + delta);
    persistLocal();
    applyData(localDB);
  }
}

async function createVideo(payload) {
  if (!PIXLECT.user) { toast('Sign in to upload'); pixlectSignIn(); return null; }
  if (!hasChannel()) { promptCreateChannel(); return null; }
  const cid = myChannelId();
  const vid = 'v_' + Math.random().toString(36).slice(2, 10);

  const meta = {
    id: vid,
    title: payload.title,
    channelId: cid,
    kind: payload.kind,
    thumb: payload.thumb || '',
    dur: payload.dur || '0:00',
    views: 0,
    likes: 0,
    desc: payload.desc || '',
    createdAt: Date.now(),
    createdBy: PIXLECT.user.uid
  };

  if (state.mode === 'firebase') {
    try {
      await set(ref(db, `pixeltube/videos/${vid}`), meta);
      await set(ref(db, `pixeltube/videoSrc/${vid}`), payload.src);
      srcCache[vid] = payload.src;
      return vid;
    } catch (e) {
      console.warn('createVideo failed', e);
      toast('Publish failed: ' + (e?.message || e));
      try { await remove(ref(db, `pixeltube/videos/${vid}`)); } catch (_) {}
      return null;
    }
  } else {
    localDB.videos[vid] = meta;
    localDB.videoSrc = localDB.videoSrc || {};
    localDB.videoSrc[vid] = payload.src;
    srcCache[vid] = payload.src;
    persistLocal();
    applyData(localDB);
    return vid;
  }
}

async function deleteVideo(vid) {
  if (state.mode === 'firebase' && db) {
    try {
      await remove(ref(db, `pixeltube/videos/${vid}`));
      await remove(ref(db, `pixeltube/videoSrc/${vid}`));
    } catch (e) { console.warn(e); toast('Could not delete'); }
  } else if (localDB) {
    delete localDB.videos[vid];
    if (localDB.videoSrc) delete localDB.videoSrc[vid];
    persistLocal();
    applyData(localDB);
  }
}

/* ============================================================
   COMMENTS
   ============================================================ */
async function addComment(vid, text) {
  if (!PIXLECT.user) { toast('Sign in to comment'); pixlectSignIn(); return; }
  const cid = 'c_' + Math.random().toString(36).slice(2, 10);
  const comment = {
    uid: PIXLECT.user.uid,
    username: PIXLECT.user.username,
    icon: PIXLECT.user.icon || { bg: '#7c4dff', emoji: '👤' },
    text,
    ts: Date.now()
  };
  if (state.mode === 'firebase') {
    try { await set(ref(db, `pixeltube/comments/${vid}/${cid}`), comment); }
    catch (e) { console.warn(e); toast('Could not post comment'); }
  } else {
    const c = localDB.comments || (localDB.comments = {});
    const v = c[vid] || (c[vid] = {});
    v[cid] = comment;
    persistLocal();
    renderComments(vid, v);
  }
}

function subscribeComments(vid) {
  if (commentsUnsub) { commentsUnsub(); commentsUnsub = null; }
  const target = document.getElementById('commentList');
  if (!target) return;
  if (state.mode === 'firebase' && db) {
    const r = ref(db, `pixeltube/comments/${vid}`);
    commentsUnsub = onValue(r, s => renderComments(vid, s.val() || {}),
      err => console.warn('comments error', err));
  } else if (localDB) {
    renderComments(vid, (localDB.comments && localDB.comments[vid]) || {});
  }
}

function renderComments(vid, map) {
  const target = document.getElementById('commentList');
  if (!target) return;
  const list = Object.values(map).sort((a, b) => (b.ts || 0) - (a.ts || 0));
  if (!list.length) {
    target.innerHTML = `<div class="no-comments">No comments yet. Be the first!</div>`;
    return;
  }
  target.innerHTML = list.map(c => `
    <div class="comment">
      ${c.icon?.avatar
        ? `<span class="pic"><img src="${esc(c.icon.avatar)}" alt=""></span>`
        : `<span class="pic" style="background:${esc(c.icon?.bg || '#7c4dff')}">${esc(c.icon?.emoji || '👤')}</span>`}
      <div class="body">
        <div class="meta"><b>${esc(c.username || 'user')}</b><span>${esc(timeAgo(c.ts || Date.now()))}</span></div>
        <div class="text">${esc(c.text)}</div>
      </div>
    </div>
  `).join('');
}

/* ============================================================
   PLAYLISTS
   ============================================================ */
function playlistsOfUser() {
  const out = [];
  for (const [pid, pl] of Object.entries(state.playlists)) {
    if (pl.ownerUid === PIXLECT.user?.uid) out.push(pl);
  }
  return out.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
}

async function createPlaylist(name) {
  if (!PIXLECT.user) { toast('Sign in to create playlists'); pixlectSignIn(); return null; }
  const pid = 'pl_' + Math.random().toString(36).slice(2, 10);
  const pl = {
    id: pid,
    name: name.trim().slice(0, 80) || 'Untitled playlist',
    ownerUid: PIXLECT.user.uid,
    ownerName: PIXLECT.user.username,
    videoIds: {},
    createdAt: Date.now()
  };
  if (state.mode === 'firebase' && db) {
    try { await set(ref(db, `pixeltube/playlists/${pid}`), pl); return pid; }
    catch (e) { console.warn(e); toast('Could not create playlist'); return null; }
  } else if (localDB) {
    localDB.playlists = localDB.playlists || {};
    localDB.playlists[pid] = pl;
    persistLocal();
    applyData(localDB);
    return pid;
  }
  return null;
}

async function deletePlaylist(pid) {
  if (state.mode === 'firebase' && db) {
    try { await remove(ref(db, `pixeltube/playlists/${pid}`)); }
    catch (e) { console.warn(e); }
  } else if (localDB) {
    delete localDB.playlists[pid];
    persistLocal();
    applyData(localDB);
  }
}

async function addToPlaylist(pid, vid) {
  if (state.mode === 'firebase' && db) {
    try { await set(ref(db, `pixeltube/playlists/${pid}/videoIds/${vid}`), true); }
    catch (e) { console.warn(e); toast('Could not add to playlist'); }
  } else if (localDB) {
    localDB.playlists[pid].videoIds = localDB.playlists[pid].videoIds || {};
    localDB.playlists[pid].videoIds[vid] = true;
    persistLocal();
    applyData(localDB);
  }
}

async function removeFromPlaylist(pid, vid) {
  if (state.mode === 'firebase' && db) {
    try { await remove(ref(db, `pixeltube/playlists/${pid}/videoIds/${vid}`)); }
    catch (e) { console.warn(e); }
  } else if (localDB) {
    if (localDB.playlists[pid].videoIds) delete localDB.playlists[pid].videoIds[vid];
    persistLocal();
    applyData(localDB);
  }
}

function playlistVideos(pid) {
  const pl = state.playlists[pid];
  if (!pl) return [];
  const ids = Object.keys(pl.videoIds || {});
  return ids.map(id => state.videos[id]).filter(Boolean);
}

      delete localDB.channels[cid];
      persistLocal();
      applyData(localDB);
    }
    closeModal();
    toast('Channel deleted');
    renderTopbar();
    renderSidebar();
    render(true);
  };
}

/* ============================================================
   ROUTER
   ============================================================ */
function parseRoute() {
  const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  return parts.length ? parts : ['home'];
}
window.addEventListener('hashchange', () => {
  if (commentsUnsub) { commentsUnsub(); commentsUnsub = null; }
  state.route = parseRoute();
  document.body.classList.remove('nav-open');
  render(true);
});

   ============================================================ */
let renderedKey = null;

function render(force = false) {
  const key = state.route.join('/');
  const isStateful = !force && key === renderedKey &&
                     (state.route[0] === 'watch' || state.route[0] === 'minis');
  if (isStateful) { syncDynamic(); return; }
  renderedKey = key;

  const view = $('#view');
  view.classList.toggle('snap', state.route[0] === 'minis');
  view.scrollTop = 0;

  const [page, arg] = state.route;

  if      (page === 'home')         view.innerHTML = viewHome();
  else if (page === 'minis')        { view.innerHTML = viewMinis(); setupMinis(); hydrateVideosInView(view); }
  else if (page === 'subs')         view.innerHTML = viewSubs();
  else if (page === 'liked')        view.innerHTML = viewLiked();
  else if (page === 'create')       { view.innerHTML = viewCreate(); setupCreateForm(); }
  else if (page === 'watch')        { view.innerHTML = viewWatch(arg); subscribeComments(arg); setupCommentForm(arg); hydrateVideosInView(view); }
  else if (page === 'channel')      view.innerHTML = viewChannel(arg);
  else if (page === 'playlists')    view.innerHTML = viewPlaylists();
  else if (page === 'playlist')     view.innerHTML = viewPlaylist(arg);
  else                              view.innerHTML = viewHome();

  syncDynamic();
}

function syncDynamic() {
  $$('[data-dyn]').forEach(el => {
    const t = el.dataset.dyn;
    if (t === 'like') {
      const on = isLiked(el.dataset.video);
      el.classList.toggle('active', on);
      const lbl = el.querySelector('.lbl');
      if (lbl) lbl.textContent = fmt(likesOf(el.dataset.video));
    } else if (t === 'sub') {
      const on = isSubbed(el.dataset.channel);
      el.classList.toggle('subbed', on);
      el.textContent = on ? 'Subscribed' : 'Subscribe';
    } else if (t === 'subcount') {
      el.textContent = fmt(subsOf(el.dataset.channel)) + ' subscribers';
    } else if (t === 'views') {
      el.textContent = fmt(viewsOf(el.dataset.video)) + ' views';
    }
  });
  renderSidebar();
}

function viewHome() {
  const all = videosSorted();

      v.title.toLowerCase().includes(q) ||
      chanOf(v.id).name.toLowerCase().includes(q));

      : `<div class="empty" style="padding:50px 24px"><p style="margin:0">No Longs yet — the Minis are above ☝️</p></div>`}

let miniObserver = null;
function setupMinis() {
  if (miniObserver) miniObserver.disconnect();
  const vids = $$('.mini video');
  if (!vids.length) return;
  miniObserver = new IntersectionObserver(entries => {
    entries.forEach(en => {
      const v = en.target;
      if (en.isIntersecting && en.intersectionRatio > 0.6) {
        v.play().catch(() => {});
        if (v.dataset.vid) registerView(v.dataset.vid);
      } else {
        v.pause();
      }
    });
  }, { threshold: [0, 0.6, 1] });
  vids.forEach(v => miniObserver.observe(v));
}

const MAX_UPLOAD_BYTES = 8 * 1024 * 1024;

function setupCreateForm() {
  const signIn = document.getElementById('createSignIn');
  if (signIn) signIn.onclick = pixlectSignIn;
  const cc = document.getElementById('createChannelBtn');
  if (cc) cc.onclick = promptCreateChannel;

  const form = document.getElementById('createForm');
  if (!form) return;

  const tabs = $$('.source-tab[data-source]');
  const paneUpload = document.getElementById('paneUpload');
  const paneUrl = document.getElementById('paneUrl');
  let sourceMode = 'upload';

  tabs.forEach(t => t.addEventListener('click', () => {
    tabs.forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    sourceMode = t.dataset.source;
    paneUpload.style.display = sourceMode === 'upload' ? '' : 'none';
    paneUrl.style.display   = sourceMode === 'url'    ? '' : 'none';
    if (sourceMode === 'url' && thumbMode === 'auto') {
      thumbAutoNote.innerHTML = `<span style="color:var(--warn)">⚠️ Auto‑thumbnail works only for uploaded videos. Switch to <b>Upload</b> or <b>URL</b> for a URL source.</span>`;
    } else {
      thumbAutoNote.textContent = 'Auto‑thumbnail will be captured from the MP4 you upload.';
    }
  }));

  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('f-file');
  const dzEmpty = document.getElementById('dropzoneEmpty');
  const dzFile = document.getElementById('dropzoneFile');
  const dzFileName = document.getElementById('dzFileName');
  const dzFileSize = document.getElementById('dzFileSize');
  const progress = document.getElementById('progress');
  const progressBar = document.getElementById('progressBar');
  const progressLabel = document.getElementById('progressLabel');
  const sizeWarn = document.getElementById('sizeWarn');

  let uploadedDataUrl = null;
  let autoThumbDataUrl = '';

  function resetVideoFile() {
    uploadedDataUrl = null;
    fileInput.value = '';
    dzEmpty.style.display = '';
    dzFile.style.display = 'none';
    dropzone.classList.remove('has-file');
    progress.style.display = 'none';
    progressBar.style.width = '0';
    progressLabel.style.display = 'none';
    sizeWarn.style.display = 'none';
  }

  function readFile(file) {
    if (!file) return;
    if (!/^video\//.test(file.type)) { toast('Please choose a video file'); return; }
    sizeWarn.style.display = 'none';

    if (file.size > MAX_UPLOAD_BYTES) {
      sizeWarn.style.display = '';
      sizeWarn.innerHTML = `⚠️ <b>${fmtBytes(file.size)}</b> is above the ${fmtBytes(MAX_UPLOAD_BYTES)} limit. Use the <b>Paste URL</b> tab for larger videos.`;
      resetVideoFile();
      return;
    }

    dzEmpty.style.display = 'none';
    dzFile.style.display = 'flex';
    dzFileName.textContent = file.name;
    dzFileSize.textContent = fmtBytes(file.size) + ' · ' + file.type;
    dropzone.classList.add('has-file');
    progress.style.display = '';
    progressBar.style.width = '0%';
    progressLabel.style.display = '';
    progressLabel.textContent = 'Reading file…';

    const reader = new FileReader();
    reader.onprogress = (ev) => {
      if (ev.lengthComputable) {
        const pct = Math.round((ev.loaded / ev.total) * 100);
        progressBar.style.width = pct + '%';
        progressLabel.textContent = `Reading… ${pct}%`;
      }
    };
    reader.onload = () => {
      uploadedDataUrl = reader.result;
      progressBar.style.width = '100%';
      progressLabel.textContent = 'Ready (' + fmtBytes(file.size) + ')';

      // Auto-fill duration from the file
      const v = document.createElement('video');
      v.preload = 'metadata';
      v.src = URL.createObjectURL(file);
      v.addEventListener('loadedmetadata', () => {
        if (isFinite(v.duration) && v.duration > 0) {
          const d = Math.round(v.duration);
          const mm = Math.floor(d / 60);
          const ss = String(d % 60).padStart(2, '0');
          document.getElementById('f-dur').value = `${mm}:${ss}`;
        }
        URL.revokeObjectURL(v.src);
      }, { once: true });
    };
    reader.onerror = () => { toast('Could not read the file'); resetVideoFile(); };
    reader.readAsDataURL(file);

    thumbAutoNote.textContent = 'Capturing thumbnail…';
    captureThumbnailFromFile(file).then((thumb) => {
      if (thumb) {
        autoThumbDataUrl = thumb;
        thumbAutoNote.innerHTML = '✅ Auto‑thumbnail captured from the video.';
        if (thumbMode === 'auto') updateThumbPreview();
      } else {
        autoThumbDataUrl = '';
        thumbAutoNote.innerHTML = `<span style="color:var(--warn)">⚠️ Could not capture a frame. Upload an image or paste a URL instead.</span>`;
        if (thumbMode === 'auto') updateThumbPreview();
      }
    });
  }

  dropzone.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', (e) => readFile(e.target.files[0]));
  dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('drag'); });
  dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag'));
  dropzone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropzone.classList.remove('drag');
    if (e.dataTransfer.files.length) readFile(e.dataTransfer.files[0]);
  });

  /* Thumbnail tabs */
  const thumbTabs = $$('.thumb-tab');
  const thumbPaneAuto = document.getElementById('thumbPaneAuto');
  const thumbPaneUpload = document.getElementById('thumbPaneUpload');
  const thumbPaneUrl = document.getElementById('thumbPaneUrl');
  const thumbAutoNote = document.getElementById('thumbAutoNote');
  const thumbPreviewImg = document.getElementById('thumbPreviewImg');
  const thumbPreviewEmpty = document.getElementById('thumbPreviewEmpty');
  const thumbPreviewBadge = document.getElementById('thumbPreviewBadge');

  let thumbMode = 'auto';
  let uploadedThumbDataUrl = '';
  let urlThumbValue = '';

  function currentThumb() {
    if (thumbMode === 'auto')   return autoThumbDataUrl;
    if (thumbMode === 'upload') return uploadedThumbDataUrl;
    if (thumbMode === 'url')    return urlThumbValue.trim();
    return '';
  }

  function updateThumbPreview() {
    const val = currentThumb();
    if (val) {
      thumbPreviewImg.src = val;
      thumbPreviewImg.style.display = 'block';
      thumbPreviewEmpty.style.display = 'none';
      thumbPreviewBadge.style.display = '';
      thumbPreviewBadge.textContent = thumbMode === 'auto' ? 'AUTO' : (thumbMode === 'upload' ? 'UPLOADED' : 'URL');
    } else {
      thumbPreviewImg.removeAttribute('src');
      thumbPreviewImg.style.display = 'none';
      thumbPreviewEmpty.style.display = '';
      thumbPreviewBadge.style.display = 'none';
    }
  }

  thumbTabs.forEach(t => t.addEventListener('click', () => {
    thumbTabs.forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    thumbMode = t.dataset.thumb;
    thumbPaneAuto.style.display   = thumbMode === 'auto'   ? '' : 'none';
    thumbPaneUpload.style.display = thumbMode === 'upload' ? '' : 'none';
    thumbPaneUrl.style.display    = thumbMode === 'url'    ? '' : 'none';
    updateThumbPreview();
  }));

  const thumbDropzone = document.getElementById('thumbDropzone');
  const thumbFileInput = document.getElementById('f-thumbfile');
  const thumbDzEmpty = document.getElementById('thumbDzEmpty');
  const thumbDzFile = document.getElementById('thumbDzFile');
  const thumbDzName = document.getElementById('thumbDzName');
  const thumbDzSize = document.getElementById('thumbDzSize');

  function readThumbFile(file) {
    if (!file) return;
    if (!/^image\//.test(file.type)) { toast('Please choose an image file'); return; }
    thumbDzEmpty.style.display = 'none';
    thumbDzFile.style.display = 'flex';
    thumbDzName.textContent = file.name;
    thumbDzSize.textContent = fmtBytes(file.size) + ' · ' + file.type;
    thumbDropzone.classList.add('has-file');
    resizeImageFile(file).then((dataUrl) => {
      if (dataUrl) { uploadedThumbDataUrl = dataUrl; updateThumbPreview(); }
      else { toast('Could not read the image'); }
    });
  }

  thumbDropzone.addEventListener('click', () => thumbFileInput.click());
  thumbFileInput.addEventListener('change', (e) => readThumbFile(e.target.files[0]));
  thumbDropzone.addEventListener('dragover', (e) => { e.preventDefault(); thumbDropzone.classList.add('drag'); });
  thumbDropzone.addEventListener('dragleave', () => thumbDropzone.classList.remove('drag'));
  thumbDropzone.addEventListener('drop', (e) => {
    e.preventDefault();
    thumbDropzone.classList.remove('drag');
    if (e.dataTransfer.files.length) readThumbFile(e.dataTransfer.files[0]);
  });

  const thumbUrlInput = document.getElementById('f-thumb');
  thumbUrlInput.addEventListener('input', () => {
    urlThumbValue = thumbUrlInput.value;
    if (thumbMode === 'url') updateThumbPreview();
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('createSubmit');
    const title = document.getElementById('f-title').value.trim();
    const kind  = document.getElementById('f-kind').value;
    const dur   = document.getElementById('f-dur').value.trim() || '0:00';
    const desc  = document.getElementById('f-desc').value.trim();

    if (!title) { toast('Title is required'); return; }

    let src = '';
    if (sourceMode === 'url') {
      src = document.getElementById('f-src').value.trim();
      if (!src) { toast('Paste a video URL'); return; }
    } else {
      if (!uploadedDataUrl) { toast('Choose an MP4 file first'); return; }
      src = uploadedDataUrl;
    }

    const thumb = currentThumb();

    btn.disabled = true;
    btn.textContent = sourceMode === 'upload' ? 'Saving to database…' : 'Publishing…';

    const vid = await createVideo({ title, src, thumb, kind, dur, desc });
    if (vid) {
      toast('Video published 🎉');
      location.hash = '#/watch/' + vid;
    } else {
      btn.disabled = false;
      btn.textContent = 'Publish';
    }
  });
}

function setupCommentForm(vid) {
  const form = document.getElementById('commentForm');
  if (!form) return;
  const ta = document.getElementById('commentText');
  const submit = document.getElementById('commentSubmit');
  const cancel = document.getElementById('commentCancel');
  ta.addEventListener('input', () => { submit.disabled = !ta.value.trim(); });
  cancel.addEventListener('click', () => { ta.value = ''; submit.disabled = true; });
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = ta.value.trim();
    if (!text) return;
    submit.disabled = true;
    submit.textContent = 'Posting…';
    await addComment(vid, text);
    ta.value = '';
    submit.textContent = 'Comment';
  });

  // Playlist save menu
  const saveBtn = document.getElementById('savePlBtn');
  const saveMenu = document.getElementById('savePlMenu');
  if (saveBtn && saveMenu) {
    saveBtn.onclick = (e) => { e.stopPropagation(); saveMenu.style.display = saveMenu.style.display === 'none' ? 'block' : 'none'; };
    document.addEventListener('click', () => saveMenu.style.display = 'none');
  }
  const newPlBtn = document.getElementById('newPlBtn');
  if (newPlBtn) newPlBtn.onclick = () => {
    const name = prompt('Playlist name:');
    if (name) createPlaylist(name).then((pid) => {
      if (pid) {
        addToPlaylist(pid, vid);
        toast('Saved to playlist');
      }
    });
  };
}

    : `background:linear-gradient(120deg,${esc(c.color)},#12121a 70%)`;

  return `

    <div class="chan-head">

      <div class="txt">
        <h1>${esc(c.name)}</h1>

  `;
}

/* ============================================================
   EVENTS
   ============================================================ */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;

  if (action === 'menu') { e.preventDefault(); document.body.classList.toggle('nav-open'); return; }
  if (action === 'like') { e.preventDefault(); e.stopPropagation(); toggleLike(el.dataset.video); return; }
  if (action === 'sub')  { e.preventDefault(); e.stopPropagation(); toggleSub(el.dataset.channel); return; }
  if (action === 'mute') {
    e.preventDefault();
    const mini = el.closest('.mini');
    if (!mini) return;
    const v = mini.querySelector('video');
    v.muted = !v.muted;
    el.textContent = v.muted ? '🔇' : '🔊';
    return;
  }
  if (action === 'share') {
    e.preventDefault();
    const url = location.origin + location.pathname + '#/watch/' + el.dataset.video;
    navigator.clipboard?.writeText(url).then(() => toast('Link copied'), () => toast(url));
    return;
  }
  if (action === 'del-video') {
    e.preventDefault();
    if (!confirm('Delete this video permanently?')) return;
    deleteVideo(el.dataset.video).then(() => { location.hash = '#/'; toast('Video deleted'); });
    return;
  }
  if (action === 'pl-add') {
    e.preventDefault();
    addToPlaylist(el.dataset.pid, el.dataset.vid);
    toast('Added to playlist');
    return;
  }
  if (action === 'pl-remove') {
    e.preventDefault();
    removeFromPlaylist(el.dataset.pid, el.dataset.vid);
    toast('Removed from playlist');
    render(true);
    return;
  }
});

window.addEventListener('pixeltube:signin', pixlectSignIn);

/* Video "play" event to count views */
document.addEventListener('play', (e) => {
  const v = e.target;
  if (v.tagName === 'VIDEO' && v.dataset.vid) registerView(v.dataset.vid);
}, true);

$('#searchInput').addEventListener('input', e => {
  state.search = e.target.value.trim();
  if (state.route[0] !== 'home' && state.search) location.hash = '#/';
  else render(true);
});

/* Empty state CTA */
document.addEventListener('click', (e) => {
  if (e.target.id === 'emptyCreateChannel') promptCreateChannel();
});

/* Playlist page actions */
document.addEventListener('click', (e) => {
  if (e.target.id === 'newPlaylistBtn') {
    const name = prompt('Playlist name:');
    if (name) createPlaylist(name).then(pid => { if (pid) location.hash = '#/playlist/' + pid; });
  }
  if (e.target.id === 'plDeleteBtn') {
    const pid = state.route[1];
    if (!confirm('Delete this playlist?')) return;
    deletePlaylist(pid).then(() => { location.hash = '#/playlists'; toast('Playlist deleted'); });
  }
  if (e.target.id === 'editChBtn') promptEditChannel();
});

/* ---------- GO ---------- */
state.route = parseRoute();
renderTopbar();
renderSidebar();
render(true);
boot();
</script>
</body>
</html>
